name: Diagnose OKX minimum copy amount

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/diagnose-min-copy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[min-copy-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect public fields
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          root = Path('.')
          payload = json.loads((root / 'trader-radar/data/traders.json').read_text(encoding='utf-8'))
          trader = next((x for x in payload.get('traders', []) if x.get('is_deep')), payload['traders'][0])
          code = trader['unique_code']
          headers = {
              'Accept': 'application/json',
              'Accept-Language': 'zh-CN',
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36',
          }

          def get(path, params):
              url = 'https://www.okx.com' + path + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as response:
                  return url, json.loads(response.read().decode('utf-8'))

          result = {'generated_at': time.time(), 'trader': {'name': trader.get('name'), 'unique_code': code}, 'responses': {}}
          calls = {
              'trade_data': ('/priapi/v5/ecotrade/public/trader/trade-data', {'latestNum': '0', 'bizType': 'SWAP', 'uniqueName': code}),
              'public_stats': ('/api/v5/copytrading/public-stats', {'instType': 'SWAP', 'uniqueCode': code, 'lastDays': '4'}),
          }
          for name, (path, params) in calls.items():
              try:
                  url, data = get(path, params)
                  entry = {'url': url, 'code': data.get('code'), 'top_keys': sorted(data.keys())}
                  rows = data.get('data') or []
                  entry['data_count'] = len(rows) if isinstance(rows, list) else None
                  if rows and isinstance(rows[0], dict):
                      row = rows[0]
                      entry['row_keys'] = sorted(row.keys())
                      if name == 'trade_data':
                          entry['non_periodic'] = [
                              {'functionId': x.get('functionId'), 'value': x.get('value')}
                              for x in row.get('nonPeriodicPart') or [] if isinstance(x, dict)
                          ]
                          entry['periodic'] = [
                              {'functionId': x.get('functionId'), 'value': x.get('value')}
                              for x in row.get('periodicPart') or [] if isinstance(x, dict)
                          ]
                      else:
                          entry['row'] = row
                  result['responses'][name] = entry
              except Exception as exc:
                  result['responses'][name] = {'error': f'{type(exc).__name__}: {exc}'}

          out = root / 'trader-radar/data/min-copy-diagnostic.json'
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Publish diagnostic
        run: |
          git config user.name "trader-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trader-radar/data/min-copy-diagnostic.json
          git commit -m "chore: record OKX minimum-copy field diagnostic"
          git pull --rebase origin master
          git push origin HEAD:master
