name: Crypto radar quality

on:
  pull_request:
    paths:
      - "crypto-radar/**"
      - ".github/workflows/crypto-radar-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          for f in crypto-radar/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate page assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path('crypto-radar')
          page = root / 'index.html'
          text = page.read_text(encoding='utf-8')

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []
                  self.ids = set()
                  self.dupes = set()
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      if a['id'] in self.ids:
                          self.dupes.add(a['id'])
                      self.ids.add(a['id'])
                  if tag == 'script' and a.get('src'):
                      self.assets.append(a['src'])
                  if tag == 'link' and a.get('rel') == 'stylesheet' and a.get('href'):
                      self.assets.append(a['href'])

          p = P(); p.feed(text); p.close()
          assert not p.dupes, f'duplicate ids: {sorted(p.dupes)}'
          for raw in p.assets:
              clean = raw.split('?', 1)[0]
              parsed = urlparse(clean)
              if parsed.scheme or clean.startswith('/'):
                  continue
              target = (root / clean).resolve()
              assert target.is_file(), f'missing referenced asset: {raw} -> {target}'
          required = ['topTabs', 'okxView', 'rankTabs', 'traderList', 'platformView', 'platformSubnav', 'platformBody']
          missing = [x for x in required if x not in p.ids]
          assert not missing, f'missing required ids: {missing}'
          print('Crypto radar asset validation passed.')
          PY

      - name: Check whitespace errors
        run: git diff --check
