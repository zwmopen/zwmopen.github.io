name: Collect OKX trader radar data

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/collect-trader-radar.yml"

permissions:
  contents: write

concurrency:
  group: public-trader-radar
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[radar-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe OKX client leaderboard
        run: python scripts/probe_okx_client.py

      - name: Publish probe response
        run: |
          git config user.name "trader-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trader-radar/data/client-probe.json
          git commit -m "chore: write OKX client leaderboard probe"
          git pull --rebase origin master
          git push origin HEAD:master
