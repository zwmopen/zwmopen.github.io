name: Collect OKX trader radar data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [master]
    paths:
      - ".github/workflows/collect-trader-radar.yml"

permissions:
  contents: write

concurrency:
  group: public-trader-radar
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[radar-now]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collector and capture complete log
        run: |
          set +e
          mkdir -p trader-radar/data
          python scripts/run_trader_radar.py > trader-radar/data/upgrade-diagnostic.txt 2>&1
          status=$?
          echo "EXIT_STATUS=$status" >> trader-radar/data/upgrade-diagnostic.txt
          tail -200 trader-radar/data/upgrade-diagnostic.txt
          exit 0
      - name: Publish diagnostic log only
        run: |
          git config user.name "trader-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trader-radar/data/upgrade-diagnostic.txt
          git commit -m "chore: write radar upgrade diagnostic"
          git pull --rebase origin master
          git push origin HEAD:master
