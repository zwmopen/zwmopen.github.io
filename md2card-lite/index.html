MD2Card Studio 是一个轻量、纯前端的 Markdown 卡片工具。

## 你可以直接做什么

- 输入 Markdown，实时生成卡片
- 长内容自动拆成多页
- 切换主题、比例和排版
- 导出当前页 PNG
- 一键打包全部页面

> 你的内容只保存在当前浏览器，不会上传到服务器。

## 小提示

使用 **Ctrl / Cmd + S** 可以快速导出当前页。</textarea><div class="editor-foot"><div class="stats"><span id="chars">0 字</span><span id="read">约 1 分钟</span></div><span id="saved" class="saved">已自动保存</span></div></section>
