<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="按资金规模、跟单人数和带单时间筛选 OKX 带单交易员">
  <meta name="theme-color" content="#ffffff">
  <title>跟单筛选 · OKX 交易员雷达</title>
  <style>
    :root{color-scheme:light;--bg:#f4f5f6;--surface:#fff;--ink:#08090a;--muted:#92969b;--line:#eceeef;--green:#247b25;--chart:#78b900;--red:#b23f63;--chip:#f2f3f4;--shadow:0 16px 42px rgba(22,29,38,.09);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg)}button,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.app{width:min(100%,880px);min-height:100vh;margin:auto;background:var(--surface)}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.titlebar{height:64px;padding:0 22px;display:flex;align-items:center;justify-content:space-between}.titlebar h1{margin:0;font-size:24px}.actions{display:flex}.icon{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:21px}.icon:hover{background:var(--chip)}.tabs{height:52px;padding:0 22px;display:flex;gap:30px;align-items:flex-end}.tab{height:52px;padding:0 0 16px;border:0;background:transparent;color:#6d7176;font-size:17px;font-weight:750;position:relative}.tab.active{color:#08090a}.tab.active:after{content:"";position:absolute;left:0;right:0;bottom:6px;height:3px;border-radius:99px;background:#08090a}
    .toolbar{position:sticky;top:117px;z-index:20;padding:17px 22px 11px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between}.sortbtn{border:0;border-radius:999px;background:var(--chip);padding:11px 15px;font-weight:750}.search{display:none;padding:0 22px 13px;background:#fff}.search.show{display:block}.search input{width:100%;height:44px;border:0;border-radius:14px;background:var(--chip);padding:0 14px;outline:0}.meta{padding:0 22px 8px;color:var(--muted);font-size:11px;line-height:1.5}.content{padding:0 22px 80px}.view{display:none}.view.active{display:block}
    .card{padding:22px 0 24px;border-bottom:1px solid var(--line)}.cardhead{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:13px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e8eaec;display:grid;place-items:center;font-weight:850}.name{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{padding:3px 7px;border-radius:5px;font-size:11px;background:#eaf3d9;color:#4a771e}.chip.short{background:#f4dce4;color:#a34462}.chip.neutral{background:#eef0f1;color:#676b70}.follow{border:0;border-radius:999px;background:#050505;color:#fff;padding:11px 20px;font-weight:850;white-space:nowrap}.performance{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:18px;align-items:end;margin-top:27px}.label{color:#9a9da2;font-size:14px}.roi{margin-top:5px;font-size:36px;line-height:1;font-weight:880;letter-spacing:-.03em;color:var(--green)}.roi.neg,.pnl.neg{color:var(--red)}.pnl{margin-top:8px;color:var(--green);font-size:14px;font-weight:700}.chartbox{min-width:0}.spark{width:100%;height:75px;display:block;overflow:visible}.periods{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.period{min-width:34px;height:26px;border:0;border-radius:8px;background:#f3f4f5;color:#74787d;font-size:11px;font-weight:750}.period.active{background:#08090a;color:#fff}.rangehint{text-align:right;color:#a3a6aa;font-size:9px;margin-top:4px}.stats{display:grid;grid-template-columns:1fr 1.25fr .72fr;gap:14px;margin-top:27px}.statlabel{display:block;color:#999da2;font-size:13px;margin-bottom:5px}.statvalue{font-size:17px;font-weight:720;white-space:nowrap}.capacity{color:#a6aaae;font-weight:500}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}.tag{padding:5px 8px;border-radius:7px;background:#f8e9ed;color:#a24361;font-size:10px}.tag.good{background:#edf5df;color:#557b27}
    .empty{padding:60px 15px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:7px}.risklist,.rules{display:grid;gap:12px;padding:10px 0}.riskcard,.rule{padding:19px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.riskcard h3,.rule b{display:block;margin:0 0 8px;font-size:18px}.riskcard p,.rule p{margin:0;color:#686c71;font-size:13px;line-height:1.7}.riskcard .follow{display:inline-block;margin-top:14px}
    dialog{border:0;padding:0}dialog::backdrop{background:rgba(0,0,0,.55)}.sheet{width:min(100%,880px);max-width:none;margin:auto auto 0;border-radius:24px 24px 0 0;background:#fff}.sheetin{padding:10px 22px calc(26px + env(safe-area-inset-bottom))}.handle{width:50px;height:5px;border-radius:99px;background:#d5d7da;margin:0 auto 24px}.sheet h2{margin:0 0 20px;font-size:22px}.options{display:grid}.option{min-height:57px;border:0;border-bottom:1px solid #f1f2f3;background:transparent;text-align:left;font-size:18px;display:flex;align-items:center;justify-content:space-between}.option.selected:after{content:"✓";width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#050505;color:#fff}.group{padding:3px 0 20px}.group h3{margin:0 0 12px;font-size:15px}.filterchips{display:flex;gap:8px;flex-wrap:wrap}.filterchip{border:1px solid #e3e5e7;border-radius:999px;background:#fff;padding:9px 13px}.filterchip.active{background:#050505;color:#fff;border-color:#050505}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ranges input{height:44px;border:1px solid #e5e7e9;border-radius:12px;padding:0 12px;outline:0}.sheetactions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.sheetactions button{height:48px;border-radius:999px;font-weight:850}.reset{border:1px solid #ddd;background:#fff}.apply{border:0;background:#050505;color:#fff}
    .detail{width:min(94vw,720px);max-height:88vh;border-radius:22px;background:#fff;box-shadow:0 26px 70px rgba(0,0,0,.27)}.detailin{padding:23px;max-height:88vh;overflow:auto}.detailhead{display:flex;justify-content:space-between;gap:15px}.detailhead h2{margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:var(--chip);font-size:22px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:19px}.detailstat{padding:13px;border-radius:13px;background:#f6f7f8}.detailstat span{display:block;color:var(--muted);font-size:11px}.detailstat b{display:block;margin-top:5px;font-size:14px}.detailrisk{margin-top:17px;color:#555;line-height:1.7;font-size:14px}.detailactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.detailactions>*{height:48px;border-radius:999px;display:grid;place-items:center;font-weight:850}.detailactions button{border:1px solid #ddd;background:#fff}.detailactions a{background:#050505;color:#fff}
    @media(max-width:700px){.titlebar{height:58px;padding:0 18px}.tabs{height:50px;padding:0 18px}.tab{height:50px}.toolbar{top:109px;padding:15px 18px 10px}.search,.meta,.content{padding-left:18px;padding-right:18px}.performance{grid-template-columns:minmax(0,1fr) 150px}.roi{font-size:33px}.stats{gap:9px}.statlabel{font-size:12px}.statvalue{font-size:15px}.detailgrid{grid-template-columns:1fr 1fr}}
    @media(max-width:430px){.cardhead{grid-template-columns:48px minmax(0,1fr) auto}.avatar{width:48px;height:48px}.name{font-size:18px}.follow{padding:10px 17px}.performance{grid-template-columns:minmax(0,1fr) 135px;gap:12px}.roi{font-size:30px}.stats{grid-template-columns:1fr 1.2fr .68fr}.detailgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="titlebar"><button class="icon" onclick="history.back()">‹</button><h1>跟单</h1><div class="actions"><button id="searchBtn" class="icon">⌕</button><button class="icon" onclick="location.reload()">⋯</button></div></div>
    <div class="tabs"><button class="tab active" data-view="list">合约</button><button class="tab" data-view="risk">风险</button><button class="tab" data-view="rules">规则</button></div>
  </header>
  <div class="toolbar"><button id="sortBtn" class="sortbtn"><span id="sortLabel">综合排序</span> ▾</button><button id="filterBtn" class="icon">⌁</button></div>
  <div id="searchBox" class="search"><input id="search" placeholder="搜索交易员名称或代码"></div>
  <div id="meta" class="meta">正在读取数据</div>
  <main class="content">
    <section id="list" class="view active"><div id="cards"></div></section>
    <section id="risk" class="view"><div id="riskList" class="risklist"></div></section>
    <section id="rules" class="view"><div class="rules">
      <article class="rule"><b>综合排序：资金第一</b><p>排除硬风险后，优先比较带单规模 AUM。真实资金规模是第一验证信号。</p></article>
      <article class="rule"><b>人数第二</b><p>资金接近时，依次比较当前跟单人数和累计跟单人数。</p></article>
      <article class="rule"><b>时间第三</b><p>人数接近时，再比较公开带单天数。时间用于判断是否经历过完整风险与心理周期。</p></article>
      <article class="rule"><b>曲线只负责排雷</b><p>警惕短期完美曲线、高频蚂蚁仓、反复大起大落、超高杠杆和一夜爆雷特征。</p></article>
      <article class="rule"><b>曲线周期</b><p>总、年、月按已采集曲线的真实时间戳裁切；公开数据不足对应周期时，不伪造历史，显示当前可用完整曲线。</p></article>
    </div></section>
  </main>
</div>

<dialog id="sortSheet" class="sheet"><div class="sheetin"><div class="handle"></div><h2>排序方式</h2><div id="sortOptions" class="options"></div></div></dialog>
<dialog id="filterSheet" class="sheet"><div class="sheetin"><div class="handle"></div><h2>筛选</h2><div class="group"><h3>带单时间</h3><div id="ageFilters" class="filterchips"><button class="filterchip active" data-age="0">全部</button><button class="filterchip" data-age="180">≥180天</button><button class="filterchip" data-age="365">≥1年</button><button class="filterchip" data-age="730">≥2年</button></div></div><div class="group"><h3>风险</h3><div id="riskFilters" class="filterchips"><button class="filterchip active" data-risk="all">全部</button><button class="filterchip" data-risk="safe">排除硬风险</button><button class="filterchip" data-risk="hard">只看硬风险</button></div></div><div class="group"><h3>最低门槛</h3><div class="ranges"><input id="minAum" inputmode="numeric" placeholder="最低AUM（美元）"><input id="minFollowers" inputmode="numeric" placeholder="最低跟单人数"></div></div><div class="sheetactions"><button id="resetFilters" class="reset">重置</button><button id="applyFilters" class="apply">查看结果</button></div></div></dialog>
<dialog id="detailDialog" class="detail"><div id="detailContent" class="detailin"></div></dialog>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const compact=new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:1});
const money=v=>v==null?'—':`$${compact.format(Number(v))}`;
const num=v=>v==null?'—':compact.format(Number(v));
const pct=v=>v==null?'—':`${Number(v).toFixed(2)}%`;
const days=v=>v==null?'—':Math.round(Number(v)).toLocaleString('zh-CN');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const HARD=['极端回撤','接近爆仓级','杠杆风险极高','疑似失活','跟单用户样本总盈亏为负'];
const SORTS=[['validated','综合排序'],['aum','带单规模'],['followers','当前跟单人数'],['days','带单天数'],['win','胜率'],['roi','收益率'],['pnl','收益额'],['copyPnl','跟单用户收益']];
let payload={},raw=[],visible=[];
let state={sort:'validated',age:0,risk:'all',minAum:0,minFollowers:0,query:''};
const chartRanges=new Map();

function isHard(t){return(t.flags||[]).some(f=>HARD.some(w=>f.includes(w)))}
function validatedCompare(a,b){
  const A=[isHard(a)?0:1,a.metrics?.aum_usd||0,a.metrics?.followers||0,a.metrics?.followers_accumulated||0,a.metrics?.lead_days||0,a.scores?.overall||0];
  const B=[isHard(b)?0:1,b.metrics?.aum_usd||0,b.metrics?.followers||0,b.metrics?.followers_accumulated||0,b.metrics?.lead_days||0,b.scores?.overall||0];
  for(let i=0;i<A.length;i++)if(A[i]!==B[i])return B[i]-A[i];
  return 0;
}
const sorters={
  validated:validatedCompare,
  aum:(a,b)=>(b.metrics?.aum_usd||0)-(a.metrics?.aum_usd||0),
  followers:(a,b)=>(b.metrics?.followers||0)-(a.metrics?.followers||0),
  days:(a,b)=>(b.metrics?.lead_days||0)-(a.metrics?.lead_days||0),
  win:(a,b)=>(b.metrics?.win_rate_pct||0)-(a.metrics?.win_rate_pct||0),
  roi:(a,b)=>(b.metrics?.roi_pct||0)-(a.metrics?.roi_pct||0),
  pnl:(a,b)=>(b.metrics?.pnl_usd||0)-(a.metrics?.pnl_usd||0),
  copyPnl:(a,b)=>(b.metrics?.copy_pnl_usd||0)-(a.metrics?.copy_pnl_usd||0)
};
function positionChip(t){const p=t.current_positions?.[0];if(!p)return'<span class="chip neutral">当前无公开仓位</span>';const short=String(p.side).toLowerCase()==='short';return`<span class="chip ${short?'short':''}">${short?'空':'多'} ${p.leverage??'—'}x</span>`}
function sourceSeries(t){return(t.roi_series||[]).map((x,i)=>({time:x.time?Date.parse(x.time):NaN,value:Number(x.roi_pct),i})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>(Number.isFinite(a.time)?a.time:a.i)-(Number.isFinite(b.time)?b.time:b.i))}
function periodSeries(t,range){const all=sourceSeries(t);if(all.length<2)return{points:all,fallback:true};if(range==='total')return{points:all,fallback:false};const timed=all.filter(x=>Number.isFinite(x.time));if(timed.length<2)return{points:all,fallback:true};const latest=timed[timed.length-1].time;const cutoff=latest-(range==='year'?365:30)*86400000;const selected=timed.filter(x=>x.time>=cutoff);return selected.length>=2?{points:selected,fallback:false}:{points:all,fallback:true}}
function sparkSvg(t,range){let {points,fallback}=periodSeries(t,range);let vals=points.map(x=>x.value);if(vals.length<2){const end=Number(t.metrics?.roi_pct||0);vals=[0,end*.18,end*.27,end*.22,end*.55,end*.7,end];fallback=true}const w=190,h=75,p=5,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;const xy=vals.map((v,i)=>`${(p+i*(w-p*2)/Math.max(1,vals.length-1)).toFixed(1)},${(h-p-(v-min)*(h-p*2)/span).toFixed(1)}`).join(' ');const pos=(t.metrics?.roi_pct||0)>=0,id=`g-${String(t.id).replace(/[^a-zA-Z0-9]/g,'')}-${range}`;return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${pos?'#8bc21f':'#b13d62'}" stop-opacity=".23"/><stop offset="1" stop-color="${pos?'#8bc21f':'#b13d62'}" stop-opacity="0"/></linearGradient></defs><polygon points="${xy} ${w-p},${h-p} ${p},${h-p}" fill="url(#${id})"/><polyline points="${xy}" fill="none" stroke="${pos?'#78b900':'#b13d62'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="periods">${[['total','总'],['year','年'],['month','月']].map(([key,label])=>`<button class="period ${range===key?'active':''}" data-range="${key}" data-trader="${esc(t.id)}">${label}</button>`).join('')}</div><div class="rangehint">${fallback&&range!=='total'?'该周期数据不足，显示可用完整曲线':'按公开曲线时间戳'}</div>`}
function avatar(t){return t.avatar_url?`<img class="avatar" src="${esc(t.avatar_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=avatar>${esc((t.name||'?').slice(0,1))}</div>'">`:`<div class="avatar">${esc((t.name||'?').slice(0,1))}</div>`}
function card(t){const m=t.metrics||{},positive=(m.roi_pct||0)>=0,range=chartRanges.get(t.id)||'total';const tags=[];if((m.lead_days||0)>=365)tags.push('<span class="tag good">超过1年</span>');if(isHard(t))tags.push('<span class="tag">硬风险</span>');(t.flags||[]).slice(0,2).forEach(f=>tags.push(`<span class="tag">${esc(f)}</span>`));return`<article class="card" data-id="${esc(t.id)}"><div class="cardhead">${avatar(t)}<div><div class="name">${esc(t.name)}</div><div class="chips">${positionChip(t)}</div></div><a class="follow" href="${esc(t.profile_url)}" target="_blank" rel="noopener" data-profile>跟单</a></div><div class="performance"><div><div class="label">近 90 日交易员收益</div><div class="roi ${positive?'':'neg'}">${positive?'+':''}${pct(m.roi_pct)}</div><div class="pnl ${(m.pnl_usd||0)>=0?'':'neg'}">${(m.pnl_usd||0)>=0?'+':''}${money(m.pnl_usd)}</div></div><div class="chartbox" data-chart="${esc(t.id)}">${sparkSvg(t,range)}</div></div><div class="stats"><div><span class="statlabel">跟单人数</span><span class="statvalue">${num(m.followers)}${m.followers_capacity!=null?`<span class="capacity">/${num(m.followers_capacity)}</span>`:''}</span></div><div><span class="statlabel">带单规模</span><span class="statvalue">${money(m.aum_usd)}</span></div><div><span class="statlabel">带单天数</span><span class="statvalue">${days(m.lead_days)}</span></div></div>${tags.length?`<div class="tags">${tags.join('')}</div>`:''}</article>`}
function apply(){const q=state.query.toLowerCase();visible=raw.filter(t=>{const m=t.metrics||{},text=`${t.name} ${t.unique_code} ${(t.flags||[]).join(' ')}`.toLowerCase();return(!q||text.includes(q))&&(m.lead_days||0)>=state.age&&(m.aum_usd||0)>=state.minAum&&(m.followers||0)>=state.minFollowers&&(state.risk==='all'||(state.risk==='safe'&&!isHard(t))||(state.risk==='hard'&&isHard(t)))}).sort(sorters[state.sort]);render()}
function render(){cards.innerHTML=visible.length?visible.map(card).join(''):'<div class="empty"><b>没有匹配结果</b><span>调整排序或筛选条件</span></div>';const risks=raw.filter(t=>isHard(t)||(t.flags||[]).length).sort((a,b)=>(b.flags?.length||0)-(a.flags?.length||0));riskList.innerHTML=risks.length?risks.map(t=>`<article class="riskcard" data-id="${esc(t.id)}"><h3>${esc(t.name)}</h3><p>${esc((t.flags||[]).join('；')||'当前没有风险标签')}</p><a class="follow" href="${esc(t.profile_url)}" target="_blank" rel="noopener" data-profile>打开主页</a></article>`).join(''):'<div class="empty"><b>暂无风险标签</b></div>';bind()}
function bind(){$$('[data-id]').forEach(n=>n.onclick=e=>{if(e.target.closest('[data-profile],[data-range]'))return;showDetail(n.dataset.id)});$$('[data-profile]').forEach(a=>a.onclick=e=>e.stopPropagation());$$('[data-range]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.trader,range=b.dataset.range,t=raw.find(x=>String(x.id)===String(id));if(!t)return;chartRanges.set(t.id,range);const box=document.querySelector(`[data-chart="${CSS.escape(String(id))}"]`);if(box)box.innerHTML=sparkSvg(t,range);bind()})}
function showDetail(id){const t=raw.find(x=>String(x.id)===String(id));if(!t)return;const m=t.metrics||{},stats=[['带单规模',money(m.aum_usd)],['当前 / 累计跟单',`${num(m.followers)} / ${num(m.followers_accumulated)}`],['公开带单天数',days(m.lead_days)],['近90日收益率',pct(m.roi_pct)],['收益额',money(m.pnl_usd)],['胜率',pct(m.win_rate_pct)],['曲线最大回撤',pct(m.max_drawdown_pct)],['跟单用户收益',money(m.copy_pnl_usd)],['综合观察分',t.scores?.overall??'—']];detailContent.innerHTML=`<div class="detailhead"><div><h2>${esc(t.name)}</h2><div class="chips">${positionChip(t)}</div></div><button class="close" onclick="detailDialog.close()">×</button></div><div class="detailgrid">${stats.map(([a,b])=>`<div class="detailstat"><span>${a}</span><b>${b}</b></div>`).join('')}</div><div class="detailrisk"><b>风险判断</b><br>${esc((t.flags||[]).join('；')||'未触发当前风险规则，仍需小额进入、定期提出利润并交给时间验证。')}</div><div class="detailactions"><button onclick="detailDialog.close()">返回</button><a href="${esc(t.profile_url)}" target="_blank" rel="noopener">打开主页 / 跟单</a></div>`;detailDialog.showModal()}
function showView(name){$$('.view').forEach(v=>v.classList.toggle('active',v.id===name));$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}
$$('.tab').forEach(b=>b.onclick=()=>showView(b.dataset.view));
function openSort(){sortOptions.innerHTML=SORTS.map(([k,l])=>`<button class="option ${state.sort===k?'selected':''}" data-sort="${k}">${l}${k==='validated'?'<small>资金 → 人数 → 时间</small>':''}</button>`).join('');$$('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;sortLabel.textContent=SORTS.find(x=>x[0]===state.sort)[1];sortSheet.close();apply()});sortSheet.showModal()}
sortBtn.onclick=openSort;filterBtn.onclick=()=>filterSheet.showModal();searchBtn.onclick=()=>{searchBox.classList.toggle('show');if(searchBox.classList.contains('show'))search.focus()};search.oninput=e=>{state.query=e.target.value.trim();apply()};
function activate(selector,key,value){$$(selector).forEach(b=>b.classList.toggle('active',b.dataset[key]===String(value)))}
$$('[data-age]').forEach(b=>b.onclick=()=>{state.age=Number(b.dataset.age);activate('[data-age]','age',state.age)});$$('[data-risk]').forEach(b=>b.onclick=()=>{state.risk=b.dataset.risk;activate('[data-risk]','risk',state.risk)});
resetFilters.onclick=()=>{state.age=0;state.risk='all';state.minAum=0;state.minFollowers=0;minAum.value='';minFollowers.value='';activate('[data-age]','age',0);activate('[data-risk]','risk','all')};applyFilters.onclick=()=>{state.minAum=Math.max(0,Number(minAum.value)||0);state.minFollowers=Math.max(0,Number(minFollowers.value)||0);filterSheet.close();apply()};
[sortSheet,filterSheet].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
async function load(){try{const r=await fetch(`./data/traders.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);payload=await r.json();raw=payload.traders||[];meta.textContent=`更新 ${payload.generated_at?new Date(payload.generated_at).toLocaleString('zh-CN'):'—'} · 已采集 ${payload.leaderboard_union_count??raw.length} 人 · 深度分析 ${payload.detail_count??raw.length} 人`;apply()}catch(e){meta.textContent=`数据读取失败：${e.message}`;cards.innerHTML='<div class="empty"><b>数据读取失败</b><span>请稍后刷新</span></div>'}}
load();
</script>
</body>
</html>
