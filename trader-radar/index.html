<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="按活跃状态、带单规模、当前跟单人数和带单时间筛选 OKX 带单交易员">
  <meta name="theme-color" content="#ffffff">
  <title>合约跟单筛选</title>
  <style>
    :root{color-scheme:light;--bg:#f5f6f7;--surface:#fff;--ink:#08090a;--muted:#96999e;--line:#eceeef;--green:#267d26;--lime:#79b900;--red:#b03f61;--chip:#f2f3f4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg)}button,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.app{width:min(100%,900px);min-height:100vh;margin:auto;background:var(--surface)}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.titlebar{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.titlebar h1{margin:0;font-size:25px}.topactions{display:flex}.iconbtn{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;font-size:22px}.iconbtn:active{background:var(--chip)}
    .toolbar{position:sticky;top:67px;z-index:25;padding:20px 24px 13px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.97);backdrop-filter:blur(16px)}.sortpill{border:0;border-radius:999px;padding:11px 16px;background:var(--chip);font-weight:750}.filterbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:23px}.filterbtn:active{background:var(--chip)}
    .searchbox{display:none;padding:0 24px 12px;background:#fff}.searchbox.show{display:block}.searchbox input{width:100%;height:44px;border:0;border-radius:14px;background:var(--chip);padding:0 15px;outline:0}.meta{padding:0 24px 4px;color:#a2a5a9;font-size:11px}.list{padding:0 24px 80px}
    .trader-card{padding:22px 0 25px;border-bottom:1px solid var(--line)}.cardhead{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#e7e9eb;display:grid;place-items:center;font-size:19px;font-weight:850;color:#555}.name{font-size:21px;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positionrow{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.position{padding:4px 8px;border-radius:6px;background:#e9f3d4;color:#4b7b19;font-size:12px}.position.short{background:#f5dce5;color:#a24161}.position.none{background:#eef0f1;color:#707479}.activity{font-size:11px;color:#777b80}.activity.active{color:#4f7a20}.activity.low{color:#a2712f}.followbtn{border:0;border-radius:999px;padding:12px 21px;background:#050505;color:#fff;font-weight:850;white-space:nowrap}
    .performance{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:end;margin-top:29px}.perf-label{color:#9b9ea3;font-size:15px}.roi{margin-top:6px;font-size:40px;line-height:1;font-weight:880;letter-spacing:-.035em;color:var(--green)}.roi.negative,.pnl.negative{color:var(--red)}.pnl{margin-top:9px;color:var(--green);font-size:15px;font-weight:700}.chart-panel{min-width:0}.chart{width:100%;height:86px;display:block;overflow:visible}.chart-empty{height:86px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(180deg,#fafafa,#fff);color:#aaa;font-size:11px}.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:5px}.periodbtn{height:24px;border:0;border-radius:7px;background:transparent;color:#999da2;font-size:11px;font-weight:800;padding:0}.periodbtn.active{background:#101112;color:#fff}.periodnote{min-height:14px;margin-top:2px;text-align:right;color:#b0b3b7;font-size:9px}
    .stats{display:grid;grid-template-columns:1fr 1.25fr .7fr;gap:16px;margin-top:30px}.statlabel{display:block;margin-bottom:6px;color:#999da2;font-size:14px}.statvalue{display:block;font-size:19px;font-weight:680;white-space:nowrap}.capacity{color:#aaaeb2;font-weight:500}.empty{padding:80px 18px;text-align:center;color:#9b9ea3}.empty b{display:block;margin-bottom:8px;color:#111;font-size:19px}
    dialog{border:0;padding:0}dialog::backdrop{background:rgba(0,0,0,.54)}.sheet{width:min(100%,900px);max-width:none;margin:auto auto 0;border-radius:25px 25px 0 0;background:#fff}.sheetinner{padding:10px 25px calc(28px + env(safe-area-inset-bottom))}.handle{width:52px;height:5px;border-radius:99px;background:#d5d7da;margin:0 auto 26px}.sheet h2{margin:0 0 23px;font-size:22px}.options{display:grid}.option{width:100%;min-height:59px;border:0;border-bottom:1px solid #f0f1f2;background:transparent;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:18px}.option small{color:#9b9ea3;font-size:11px;margin-left:auto;margin-right:12px}.option.selected:after{content:"✓";width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#050505;color:#fff;font-weight:900}.group{padding:2px 0 21px}.group h3{margin:0 0 12px;font-size:15px}.filterchips{display:flex;gap:9px;flex-wrap:wrap}.filterchip{border:1px solid #e3e5e7;border-radius:999px;padding:9px 14px;background:#fff}.filterchip.active{border-color:#050505;background:#050505;color:#fff}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ranges input{height:45px;border:1px solid #e5e7e9;border-radius:12px;padding:0 12px;outline:0}.sheetactions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.sheetactions button{height:49px;border-radius:999px;font-weight:850}.reset{border:1px solid #ddd;background:#fff}.applybtn{border:0;background:#050505;color:#fff}
    .detail{width:min(94vw,720px);max-height:88vh;border-radius:23px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.28)}.detailinner{padding:24px;max-height:88vh;overflow:auto}.detailhead{display:flex;justify-content:space-between;gap:15px}.detailhead h2{margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:var(--chip);font-size:22px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.detailstat{padding:13px;border-radius:13px;background:#f6f7f8}.detailstat span{display:block;color:#93979c;font-size:11px}.detailstat b{display:block;margin-top:6px;font-size:14px}.detailtext{margin-top:18px;color:#555;line-height:1.75;font-size:14px}.detailactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.detailactions>*{height:49px;border-radius:999px;display:grid;place-items:center;font-weight:850}.detailactions button{border:1px solid #ddd;background:#fff}.detailactions a{background:#050505;color:#fff}
    @media(max-width:700px){.titlebar{height:58px;padding:0 18px}.toolbar{top:59px;padding:17px 18px 11px}.searchbox,.meta,.list{padding-left:18px;padding-right:18px}.performance{grid-template-columns:minmax(0,1fr) 160px;gap:14px}.chart,.chart-empty{height:76px}.roi{font-size:35px}.stats{gap:10px}.statlabel{font-size:12px}.statvalue{font-size:16px}.detailgrid{grid-template-columns:1fr 1fr}}
    @media(max-width:430px){.cardhead{grid-template-columns:52px minmax(0,1fr) auto}.avatar{width:52px;height:52px}.name{font-size:19px}.followbtn{padding:10px 18px}.performance{grid-template-columns:minmax(0,1fr) 145px;gap:10px}.roi{font-size:32px}.periodbtn{font-size:10px}.stats{grid-template-columns:1fr 1.2fr .67fr}.statvalue{font-size:15px}.detailgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="titlebar"><button class="iconbtn" onclick="history.back()">‹</button><h1>跟单</h1><div class="topactions"><button id="searchBtn" class="iconbtn">⌕</button><button class="iconbtn" onclick="location.reload()">⋯</button></div></div></header>
  <div class="toolbar"><button id="sortBtn" class="sortpill"><span id="sortLabel">综合排序</span> ▾</button><button id="filterBtn" class="filterbtn">⌁</button></div>
  <div id="searchBox" class="searchbox"><input id="search" placeholder="搜索交易员名称或代码"></div>
  <div id="meta" class="meta">正在读取数据</div>
  <main id="cards" class="list"></main>
</div>
<dialog id="sortSheet" class="sheet"><div class="sheetinner"><div class="handle"></div><h2>排序方式</h2><div id="sortOptions" class="options"></div></div></dialog>
<dialog id="filterSheet" class="sheet"><div class="sheetinner"><div class="handle"></div><h2>筛选</h2><div class="group"><h3>活跃状态</h3><div class="filterchips"><button class="filterchip active" data-activity="active">只看活跃</button><button class="filterchip" data-activity="all">全部</button><button class="filterchip" data-activity="unknown">活跃度未知</button></div></div><div class="group"><h3>带单时间</h3><div class="filterchips"><button class="filterchip active" data-age="0">全部</button><button class="filterchip" data-age="180">≥180天</button><button class="filterchip" data-age="365">≥1年</button><button class="filterchip" data-age="730">≥2年</button></div></div><div class="group"><h3>最低门槛</h3><div class="ranges"><input id="minAum" inputmode="numeric" placeholder="最低带单规模"><input id="minFollowers" inputmode="numeric" placeholder="最低当前人数"></div></div><div class="sheetactions"><button id="resetFilters" class="reset">重置</button><button id="applyFilters" class="applybtn">查看结果</button></div></div></dialog>
<dialog id="detailDialog" class="detail"><div id="detailContent" class="detailinner"></div></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const compact=new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:1});
const money=v=>v==null?'—':`$${compact.format(Number(v))}`;
const num=v=>v==null?'—':compact.format(Number(v));
const pct=v=>v==null?'—':`${Number(v).toFixed(2)}%`;
const days=v=>v==null?'—':Math.round(Number(v)).toLocaleString('zh-CN');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const HARD=['极端回撤','接近爆仓级','杠杆风险极高','长期未开单','跟单用户样本总盈亏为负'];
const SORTS=[['validated','综合排序','活跃 → 规模 → 当前人数 → 时间'],['aum','带单规模',''],['followers','当前跟单人数',''],['days','带单天数',''],['roi','收益率',''],['pnl','收益额','']];
const PERIODS=[['total','总'],['year','年'],['month','月'],['week','周'],['day','日']];
let payload={},raw=[],visible=[];
let state={sort:'validated',activity:'active',age:0,minAum:0,minFollowers:0,query:''};
const selectedPeriods=new Map();
function hardRisk(t){return(t.flags||[]).some(f=>HARD.some(w=>f.includes(w)))}
function activityTier(t){const m=t.metrics||{};if(Number.isFinite(Number(m.activity_tier)))return Number(m.activity_tier);if((m.current_positions_count||0)>0||(m.trades_last_30d||0)>0)return 3;if((m.history_trade_count||0)>0)return 2;return -1}
function activityLabel(t){const m=t.metrics||{},tier=activityTier(t);if(m.activity_status)return m.activity_status;if(tier>=3)return'活跃';if(tier===2)return'近期有交易';return'活跃度未知'}
function validatedCompare(a,b){const A=[activityTier(a),hardRisk(a)?0:1,a.metrics?.aum_usd||0,a.metrics?.followers||0,a.metrics?.lead_days||0],B=[activityTier(b),hardRisk(b)?0:1,b.metrics?.aum_usd||0,b.metrics?.followers||0,b.metrics?.lead_days||0];for(let i=0;i<A.length;i++)if(A[i]!==B[i])return B[i]-A[i];return 0}
const sorters={validated:validatedCompare,aum:(a,b)=>(b.metrics?.aum_usd||0)-(a.metrics?.aum_usd||0),followers:(a,b)=>(b.metrics?.followers||0)-(a.metrics?.followers||0),days:(a,b)=>(b.metrics?.lead_days||0)-(a.metrics?.lead_days||0),roi:(a,b)=>(b.metrics?.roi_pct||0)-(a.metrics?.roi_pct||0),pnl:(a,b)=>(b.metrics?.pnl_usd||0)-(a.metrics?.pnl_usd||0)};
function positionHtml(t){const p=t.current_positions?.find(x=>x.instrument)||t.current_positions?.[0];if(!p)return'<span class="position none">当前无公开仓位</span>';const short=String(p.side).toLowerCase()==='short';return`<span class="position ${short?'short':''}">${short?'空':'多'} ${p.leverage??'—'}x</span>`}
function avatarHtml(t){const letter=esc((t.name||'?').slice(0,1));return t.avatar_url?`<img class="avatar" src="${esc(t.avatar_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=avatar>${letter}</div>'">`:`<div class="avatar">${letter}</div>`}
function sourceSeries(t){return(t.roi_series||[]).map((x,i)=>({time:x.time?Date.parse(x.time):NaN,value:Number(x.roi_pct),i})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>(Number.isFinite(a.time)?a.time:a.i)-(Number.isFinite(b.time)?b.time:b.i))}
function periodSeries(t,period){const all=sourceSeries(t);if(all.length<2)return{points:[],note:'暂无公开曲线数据'};if(period==='total')return{points:all,note:'当前已采集的完整曲线'};const timed=all.filter(x=>Number.isFinite(x.time));if(timed.length<2)return{points:[],note:'暂无该周期真实数据'};const spanDays={year:365,month:30,week:7,day:1}[period],latest=timed[timed.length-1].time,cutoff=latest-spanDays*86400000,selected=timed.filter(x=>x.time>=cutoff);if(selected.length<2)return{points:[],note:'暂无该周期真实数据'};const coverage=Math.max(1,Math.round((selected.at(-1).time-selected[0].time)/86400000));return{points:selected,note:`覆盖约 ${coverage} 天`}}
function chartHtml(t,period){const result=periodSeries(t,period),buttons=PERIODS.map(([key,label])=>`<button class="periodbtn ${period===key?'active':''}" data-period="${key}">${label}</button>`).join('');if(!result.points.length)return`<div class="chart-empty">${esc(result.note)}</div><div class="periods">${buttons}</div><div class="periodnote">只显示真实周期数据</div>`;const vals=result.points.map(x=>x.value),w=220,h=86,p=5,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1,points=vals.map((v,i)=>`${(p+i*(w-p*2)/Math.max(1,vals.length-1)).toFixed(1)},${(h-p-(v-min)*(h-p*2)/span).toFixed(1)}`).join(' '),positive=(t.metrics?.roi_pct||0)>=0,id=`g${String(t.id).replace(/[^a-zA-Z0-9]/g,'')}${period}`;return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${positive?'#8fc52a':'#b03f61'}" stop-opacity=".22"/><stop offset="1" stop-color="${positive?'#8fc52a':'#b03f61'}" stop-opacity="0"/></linearGradient></defs><polygon points="${points} ${w-p},${h-p} ${p},${h-p}" fill="url(#${id})"/><polyline points="${points}" fill="none" stroke="${positive?'#79b900':'#b03f61'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="periods">${buttons}</div><div class="periodnote">${esc(result.note)}</div>`}
function cardHtml(t){const m=t.metrics||{},positive=(m.roi_pct||0)>=0,period=selectedPeriods.get(String(t.id))||'total',tier=activityTier(t),activityClass=tier>=3?'active':tier>=1?'low':'';return`<article class="trader-card" data-id="${esc(t.id)}"><div class="cardhead">${avatarHtml(t)}<div><div class="name">${esc(t.name)}</div><div class="positionrow">${positionHtml(t)}<span class="activity ${activityClass}">${esc(activityLabel(t))}</span></div></div><a class="followbtn" href="${esc(t.profile_url)}" target="_blank" rel="noopener" data-profile>跟单</a></div><div class="performance"><div><div class="perf-label">近 90 日交易员收益</div><div class="roi ${positive?'':'negative'}">${positive?'+':''}${pct(m.roi_pct)}</div><div class="pnl ${(m.pnl_usd||0)>=0?'':'negative'}">${(m.pnl_usd||0)>=0?'+':''}${money(m.pnl_usd)}</div></div><div class="chart-panel">${chartHtml(t,period)}</div></div><div class="stats"><div><span class="statlabel">当前跟单人数</span><span class="statvalue">${num(m.followers)}${m.followers_capacity!=null?`<span class="capacity">/${num(m.followers_capacity)}</span>`:''}</span></div><div><span class="statlabel">带单规模</span><span class="statvalue">${money(m.aum_usd)}</span></div><div><span class="statlabel">带单天数</span><span class="statvalue">${days(m.lead_days)}</span></div></div></article>`}
function matchesActivity(t){const tier=activityTier(t);if(state.activity==='all')return true;if(state.activity==='unknown')return tier<0;return tier>=2}
function apply(){const q=state.query.toLowerCase();visible=raw.filter(t=>{const m=t.metrics||{},text=`${t.name} ${t.unique_code}`.toLowerCase();return(!q||text.includes(q))&&matchesActivity(t)&&(m.lead_days||0)>=state.age&&(m.aum_usd||0)>=state.minAum&&(m.followers||0)>=state.minFollowers}).sort(sorters[state.sort]);cards.innerHTML=visible.length?visible.map(cardHtml).join(''):'<div class="empty"><b>没有匹配结果</b><span>调整筛选条件后再看</span></div>'}
function openDetail(id){const t=raw.find(x=>String(x.id)===String(id));if(!t)return;const m=t.metrics||{},stats=[['活跃状态',activityLabel(t)],['带单规模',money(m.aum_usd)],['当前跟单人数',num(m.followers)],['带单天数',days(m.lead_days)],['近90日收益率',pct(m.roi_pct)],['收益额',money(m.pnl_usd)],['当前仓位',num(m.current_positions_count)],['最近交易',m.days_since_last_trade==null?'接口未提供':`${Number(m.days_since_last_trade).toFixed(1)}天前`],['累计历史人数',`${num(m.followers_accumulated)}（不参与排序）`]];detailContent.innerHTML=`<div class="detailhead"><div><h2>${esc(t.name)}</h2><div class="positionrow">${positionHtml(t)}</div></div><button class="close" onclick="detailDialog.close()">×</button></div><div class="detailgrid">${stats.map(([a,b])=>`<div class="detailstat"><span>${esc(a)}</span><b>${b}</b></div>`).join('')}</div><div class="detailtext"><b>风险提示</b><br>${esc((t.flags||[]).join('；')||'当前没有触发系统风险标签。')}</div><div class="detailactions"><button onclick="detailDialog.close()">返回</button><a href="${esc(t.profile_url)}" target="_blank" rel="noopener">打开主页 / 跟单</a></div>`;detailDialog.showModal()}
cards.addEventListener('click',e=>{const periodBtn=e.target.closest('[data-period]');if(periodBtn){e.preventDefault();e.stopPropagation();const card=periodBtn.closest('.trader-card'),id=card?.dataset.id,t=raw.find(x=>String(x.id)===String(id));if(!t)return;const period=periodBtn.dataset.period;selectedPeriods.set(String(id),period);card.querySelector('.chart-panel').innerHTML=chartHtml(t,period);return}if(e.target.closest('[data-profile]'))return;const card=e.target.closest('.trader-card');if(card)openDetail(card.dataset.id)});
function openSort(){sortOptions.innerHTML=SORTS.map(([k,l,n])=>`<button class="option ${state.sort===k?'selected':''}" data-sort="${k}"><span>${l}</span>${n?`<small>${n}</small>`:''}</button>`).join('');sortOptions.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;sortLabel.textContent=SORTS.find(x=>x[0]===state.sort)[1];sortSheet.close();apply()});sortSheet.showModal()}
sortBtn.onclick=openSort;filterBtn.onclick=()=>filterSheet.showModal();searchBtn.onclick=()=>{searchBox.classList.toggle('show');if(searchBox.classList.contains('show'))search.focus()};search.oninput=e=>{state.query=e.target.value.trim();apply()};
function activate(selector,key,value){$$(selector).forEach(b=>b.classList.toggle('active',b.dataset[key]===String(value)))}
$$('[data-activity]').forEach(b=>b.onclick=()=>{state.activity=b.dataset.activity;activate('[data-activity]','activity',state.activity)});$$('[data-age]').forEach(b=>b.onclick=()=>{state.age=Number(b.dataset.age);activate('[data-age]','age',state.age)});
resetFilters.onclick=()=>{state.activity='active';state.age=0;state.minAum=0;state.minFollowers=0;minAum.value='';minFollowers.value='';activate('[data-activity]','activity','active');activate('[data-age]','age',0)};applyFilters.onclick=()=>{state.minAum=Math.max(0,Number(minAum.value)||0);state.minFollowers=Math.max(0,Number(minFollowers.value)||0);filterSheet.close();apply()};
[sortSheet,filterSheet].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
async function load(){try{const r=await fetch(`./data/traders.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);payload=await r.json();raw=payload.traders||[];meta.textContent=`更新 ${payload.generated_at?new Date(payload.generated_at).toLocaleString('zh-CN'):'—'} · 当前人数只取 copyTraderNum · 共 ${raw.length} 人`;apply()}catch(e){meta.textContent=`数据读取失败：${e.message}`;cards.innerHTML='<div class="empty"><b>数据读取失败</b><span>稍后刷新页面</span></div>'}}
load();
</script>
</body>
</html>
