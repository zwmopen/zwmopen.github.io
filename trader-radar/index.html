<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="按带单规模、当前跟单人数与带单天数筛选 OKX 带单交易员">
  <meta name="theme-color" content="#ffffff">
  <title>合约跟单筛选</title>
  <style>
    :root{color-scheme:light;--bg:#f5f6f7;--surface:#fff;--ink:#08090a;--muted:#96999e;--line:#eceeef;--green:#267d26;--lime:#79b900;--red:#b03f61;--amber:#9a671e;--blue:#2867a9;--chip:#f2f3f4;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-width:320px;color:var(--ink);background:var(--bg)}button,input{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.app{width:min(100%,920px);min-height:100vh;margin:auto;background:var(--surface)}
    .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.titlebar{height:66px;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.titlebar h1{margin:0;font-size:25px}.topactions{display:flex}.iconbtn{width:42px;height:42px;border:0;border-radius:50%;display:grid;place-items:center;background:transparent;font-size:22px}.iconbtn:active{background:var(--chip)}
    .toolbar{position:sticky;top:67px;z-index:25;padding:18px 24px 12px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.97);backdrop-filter:blur(16px)}.sortpill{border:0;border-radius:999px;padding:11px 16px;background:var(--chip);font-weight:760}.filterbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;font-size:23px}.filterbtn:active{background:var(--chip)}
    .searchbox{display:none;padding:0 24px 12px;background:#fff}.searchbox.show{display:block}.searchbox input{width:100%;height:44px;border:0;border-radius:14px;background:var(--chip);padding:0 15px;outline:0}.meta{padding:0 24px 6px;color:#a2a5a9;font-size:11px;line-height:1.5}.health{display:none;margin:6px 24px 0;padding:10px 12px;border-radius:11px;background:#f9e9ee;color:#9e3e5d;font-size:11px}.health.show{display:block}.list{padding:0 24px 50px}
    .trader-card{padding:22px 0 25px;border-bottom:1px solid var(--line)}.cardhead{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:14px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#e7e9eb;display:grid;place-items:center;font-size:19px;font-weight:850;color:#555}.name{font-size:21px;font-weight:790;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badges{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.position,.badge{padding:4px 8px;border-radius:6px;font-size:11px}.position{background:#e9f3d4;color:#4b7b19}.position.short{background:#f5dce5;color:#a24161}.badge.curve{background:#edf4fb;color:#2867a9}.badge.deep{background:#eeeff0;color:#666}.badge.stale{background:#f7eddb;color:#9a671e}.followbtn{border:0;border-radius:999px;padding:12px 21px;background:#050505;color:#fff;font-weight:850;white-space:nowrap}
    .performance{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:20px;align-items:end;margin-top:29px}.perf-label{color:#9b9ea3;font-size:15px}.roi{margin-top:6px;font-size:40px;line-height:1;font-weight:880;letter-spacing:-.035em;color:var(--green)}.roi.negative,.pnl.negative{color:var(--red)}.pnl{margin-top:9px;color:var(--green);font-size:15px;font-weight:700}.drawdown{margin-top:7px;color:#999da2;font-size:10px}.chart-panel{min-width:0;cursor:pointer;border-radius:12px;padding:3px;transition:background .18s}.chart-panel:hover{background:#f6f7f8}.chart{width:100%;height:86px;display:block;overflow:visible}.chart-empty{height:86px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(180deg,#fafafa,#fff);color:#aaa;font-size:11px;text-align:center;padding:8px}.periods{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:5px}.periodbtn{height:24px;border:0;border-radius:7px;background:transparent;color:#999da2;font-size:11px;font-weight:800;padding:0}.periodbtn.active{background:#101112;color:#fff}.periodnote{min-height:13px;margin-top:2px;text-align:right;color:#b0b3b7;font-size:9px}.chart-open-tip{text-align:right;color:#8d939a;font-size:9px;margin-top:1px}
    .stats{display:grid;grid-template-columns:1fr 1.25fr .7fr;gap:16px;margin-top:28px}.statlabel{display:block;margin-bottom:6px;color:#999da2;font-size:14px}.statvalue{display:block;font-size:19px;font-weight:680;white-space:nowrap}.capacity{color:#aaaeb2;font-weight:500}
    .change-panel{margin-top:15px;padding:10px;border-radius:12px;background:#f7f8f9}.change-tabs{display:flex;gap:5px;margin-bottom:8px}.changebtn{border:0;border-radius:7px;padding:5px 9px;background:transparent;color:#999;font-size:10px;font-weight:800}.changebtn.active{background:#111;color:#fff}.change-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.change span{display:block;color:#999da2;font-size:9px}.change b{display:block;margin-top:4px;font-size:11px}.up{color:var(--green)}.down{color:var(--red)}.flat{color:#777}
    .alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px}.alert{padding:6px 9px;border-radius:8px;font-size:10px}.alert.capital{background:#f7eddb;color:#94651f}.alert.trading{background:#f8e8ed;color:#a33c5d}.alert.data{background:#eaf1f8;color:#2867a9}.alert.low{opacity:.72}.empty{padding:80px 18px;text-align:center;color:#9b9ea3}.empty b{display:block;margin-bottom:8px;color:#111;font-size:19px}.loadmore{display:block;width:calc(100% - 48px);height:48px;margin:0 24px 70px;border:0;border-radius:999px;background:#f1f2f3;font-weight:800}.loadmore[hidden]{display:none}
    dialog{border:0;padding:0}dialog::backdrop{background:rgba(0,0,0,.54)}.sheet{width:min(100%,920px);max-width:none;margin:auto auto 0;border-radius:25px 25px 0 0;background:#fff}.sheetinner{padding:10px 25px calc(28px + env(safe-area-inset-bottom))}.handle{width:52px;height:5px;border-radius:99px;background:#d5d7da;margin:0 auto 26px}.sheet h2{margin:0 0 23px;font-size:22px}.options{display:grid}.option{width:100%;min-height:59px;border:0;border-bottom:1px solid #f0f1f2;background:transparent;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:18px}.option small{color:#9b9ea3;font-size:11px;margin-left:auto;margin-right:12px}.option.selected:after{content:"✓";width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#050505;color:#fff;font-weight:900}.group{padding:2px 0 21px}.group h3{margin:0 0 12px;font-size:15px}.filterchips{display:flex;gap:9px;flex-wrap:wrap}.filterchip{border:1px solid #e3e5e7;border-radius:999px;padding:9px 14px;background:#fff}.filterchip.active{border-color:#050505;background:#050505;color:#fff}.ranges{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ranges input{height:45px;border:1px solid #e5e7e9;border-radius:12px;padding:0 12px;outline:0}.sheetactions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.sheetactions button{height:49px;border-radius:999px;font-weight:850}.reset{border:1px solid #ddd;background:#fff}.applybtn{border:0;background:#050505;color:#fff}
    .detail{width:min(94vw,780px);max-height:90vh;border-radius:23px;background:#fff;box-shadow:0 28px 80px rgba(0,0,0,.28)}.detailinner{padding:24px;max-height:90vh;overflow:auto}.detailhead{display:flex;justify-content:space-between;gap:15px}.detailhead h2{margin:0}.close{width:38px;height:38px;border:0;border-radius:50%;background:var(--chip);font-size:22px}.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.detailstat{padding:13px;border-radius:13px;background:#f6f7f8}.detailstat span{display:block;color:#93979c;font-size:11px}.detailstat b{display:block;margin-top:6px;font-size:14px}.detailtext{margin-top:18px;color:#555;line-height:1.75;font-size:14px}.change-table{width:100%;border-collapse:collapse;margin-top:12px}.change-table th,.change-table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.change-table th{color:#96999e}.quality-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.quality-item{padding:8px;border-radius:8px;background:#f6f7f8;font-size:11px}.quality-item.ok{color:var(--green)}.quality-item.bad{color:var(--red)}.detailactions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.detailactions>*{height:49px;border-radius:999px;display:grid;place-items:center;font-weight:850}.detailactions button{border:1px solid #ddd;background:#fff}.detailactions a{background:#050505;color:#fff}
    @media(max-width:700px){.titlebar{height:58px;padding:0 18px}.toolbar{top:59px;padding:16px 18px 10px}.searchbox,.meta,.list{padding-left:18px;padding-right:18px}.health{margin-left:18px;margin-right:18px}.performance{grid-template-columns:minmax(0,1fr) 165px;gap:12px}.chart,.chart-empty{height:76px}.roi{font-size:34px}.stats{gap:9px}.statlabel{font-size:12px}.statvalue{font-size:16px}.change-grid{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:1fr 1fr}.loadmore{width:calc(100% - 36px);margin-left:18px;margin-right:18px}}
    @media(max-width:430px){.cardhead{grid-template-columns:52px minmax(0,1fr) auto}.avatar{width:52px;height:52px}.name{font-size:19px}.followbtn{padding:10px 18px}.performance{grid-template-columns:minmax(0,1fr) 145px;gap:9px}.roi{font-size:31px}.periodbtn{font-size:10px}.stats{grid-template-columns:1fr 1.2fr .67fr}.statvalue{font-size:15px}.detailgrid,.quality-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="titlebar"><button class="iconbtn" onclick="history.back()">‹</button><h1>跟单</h1><div class="topactions"><button id="searchBtn" class="iconbtn">⌕</button><button class="iconbtn" onclick="location.reload()">⋯</button></div></div></header>
  <div class="toolbar"><button id="sortBtn" class="sortpill"><span id="sortLabel">综合排序</span> ▾</button><button id="filterBtn" class="filterbtn">⌁</button></div>
  <div id="searchBox" class="searchbox"><input id="search" placeholder="搜索交易员名称或代码"></div>
  <div id="meta" class="meta">正在读取数据</div>
  <div id="health" class="health"></div>
  <main id="cards" class="list"></main>
  <button id="loadMore" class="loadmore" hidden>继续加载</button>
</div>
<dialog id="sortSheet" class="sheet"><div class="sheetinner"><div class="handle"></div><h2>排序方式</h2><div id="sortOptions" class="options"></div></div></dialog>
<dialog id="filterSheet" class="sheet"><div class="sheetinner"><div class="handle"></div><h2>筛选</h2><div class="group"><h3>带单时间</h3><div class="filterchips"><button class="filterchip active" data-age="0">全部</button><button class="filterchip" data-age="180">≥180天</button><button class="filterchip" data-age="365">≥1年</button><button class="filterchip" data-age="730">≥2年</button></div></div><div class="group"><h3>风险类型</h3><div class="filterchips"><button class="filterchip active" data-alert="all">全部</button><button class="filterchip" data-alert="capital">资金异常</button><button class="filterchip" data-alert="trading">交易风险</button><button class="filterchip" data-alert="data">数据异常</button><button class="filterchip" data-alert="none">无预警</button></div></div><div class="group"><h3>数据覆盖</h3><div class="filterchips"><button class="filterchip active" data-coverage="all">全部</button><button class="filterchip" data-coverage="curve">完整曲线</button><button class="filterchip" data-coverage="deep">深度分析</button></div></div><div class="group"><h3>最低门槛</h3><div class="ranges"><input id="minAum" inputmode="numeric" placeholder="最低带单规模"><input id="minFollowers" inputmode="numeric" placeholder="最低当前人数"></div></div><div class="sheetactions"><button id="resetFilters" class="reset">重置</button><button id="applyFilters" class="applybtn">查看结果</button></div></div></dialog>
<dialog id="detailDialog" class="detail"><div id="detailContent" class="detailinner"></div></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sortSheet=$('#sortSheet'),filterSheet=$('#filterSheet'),detailDialog=$('#detailDialog');
const exactMoney=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const compact=new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:1});
const money=v=>v==null?'—':`$${exactMoney.format(Number(v))}`;
const shortMoney=v=>v==null?'—':`${Number(v)>=0?'+':'-'}$${compact.format(Math.abs(Number(v)))}`;
const num=v=>v==null?'—':Math.round(Number(v)).toLocaleString('en-US');
const pct=v=>v==null?'—':`${Number(v).toFixed(2)}%`;
const days=v=>v==null?'—':Math.round(Number(v)).toLocaleString('en-US');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const SORTS=[['validated','综合排序','规模 → 当前人数 → 时间'],['aum','带单规模','客户端完整榜单'],['followers','当前跟单人数','客户端 followerNum'],['days','带单天数',''],['roi','收益率',''],['pnl','收益额',''],['alerts','风险预警','高风险优先']];
const PERIODS=[['total','总'],['year','年'],['month','月'],['week','周'],['day','日']];
const PERIOD_LABELS={total:'总收益',year:'近1年收益',month:'近30日收益',week:'周收益',day:'日收益'};
const PAGE_SIZE=25;
let payload={},raw=[],visible=[],renderCount=PAGE_SIZE;
let state={sort:'validated',age:0,alert:'all',coverage:'all',minAum:0,minFollowers:0,query:''};
const selectedPeriods=new Map(),selectedChanges=new Map(),officialIndexes={};
function buildOfficialIndexes(){for(const [key,codes] of Object.entries(payload.official_orders||{})){officialIndexes[key]=new Map(codes.map((code,index)=>[String(code),index]))}}
function validatedCompare(a,b){const A=[a.metrics?.aum_usd||0,a.metrics?.followers||0,a.metrics?.lead_days||0],B=[b.metrics?.aum_usd||0,b.metrics?.followers||0,b.metrics?.lead_days||0];for(let i=0;i<A.length;i++)if(A[i]!==B[i])return B[i]-A[i];return 0}
function officialCompare(kind,field,a,b){const index=officialIndexes[kind];if(index){const ai=index.get(String(a.unique_code)),bi=index.get(String(b.unique_code));if(ai!=null||bi!=null){if(ai==null)return 1;if(bi==null)return-1;if(ai!==bi)return ai-bi}}return(b.metrics?.[field]||0)-(a.metrics?.[field]||0)}
const levelWeight={high:3,medium:2,low:1,none:0};
const sorters={validated:validatedCompare,aum:(a,b)=>officialCompare('aum','aum_usd',a,b),followers:(a,b)=>officialCompare('followers','followers',a,b),days:(a,b)=>officialCompare('days','lead_days',a,b),roi:(a,b)=>officialCompare('roi','roi_pct',a,b),pnl:(a,b)=>officialCompare('pnl','pnl_usd',a,b),alerts:(a,b)=>(levelWeight[b.alert_level]||0)-(levelWeight[a.alert_level]||0)||validatedCompare(a,b)};
function positionHtml(t){if(!t.is_deep)return'';const p=t.current_positions?.find(x=>x.instrument)||t.current_positions?.[0];if(!p)return'';const short=String(p.side).toLowerCase()==='short';return`<span class="position ${short?'short':''}">${short?'空':'多'} ${p.leverage??'—'}x</span>`}
function avatarHtml(t){const letter=esc((t.name||'?').slice(0,1));return t.avatar_url?`<img class="avatar" src="${esc(t.avatar_url)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=avatar>${letter}</div>'">`:`<div class="avatar">${letter}</div>`}
function badgesHtml(t){const list=[];const position=positionHtml(t);if(position)list.push(position);if(t.is_curve_full)list.push('<span class="badge curve">完整曲线</span>');if(t.is_deep)list.push('<span class="badge deep">深度分析</span>');if(t.data_quality?.fresh===false)list.push('<span class="badge stale">沿用旧深度数据</span>');return list.length?`<div class="badges">${list.join('')}</div>`:''}
function sourceSeries(t,period){const raw=period==='week'?(t.weekly_roi_series||[]):(t.roi_series||[]);let series=raw.map((x,i)=>({time:x.time?Date.parse(x.time):NaN,value:Number(x.roi_pct),pnl:x.pnl_usd==null?null:Number(x.pnl_usd),i})).filter(x=>Number.isFinite(x.value)).sort((a,b)=>(Number.isFinite(a.time)?a.time:a.i)-(Number.isFinite(b.time)?b.time:b.i));if(period==='day')return series.slice(-2);if(period==='year'||period==='month'){const days=period==='year'?365:30;const timed=series.filter(x=>Number.isFinite(x.time));if(!timed.length)return[];const cutoff=timed.at(-1).time-days*86400000;return timed.filter(x=>x.time>=cutoff)}return series}
function periodData(t,period){const meta=t.period_metrics?.[period]||{};const series=sourceSeries(t,period);return{available:Boolean(meta.available)&&series.length>=2,series,roi:meta.roi_pct,pnl:meta.pnl_usd,drawdown:meta.max_drawdown_pct,source:meta.source||'',label:PERIOD_LABELS[period]}}
function chartSvg(t,period){const d=periodData(t,period);if(!d.available)return`<div class="chart-empty">${t.is_curve_full?'暂无该周期真实数据':'该账户未进入前50完整曲线采集'}</div>`;const vals=d.series.map(x=>x.value),w=235,h=86,p=5,min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1,points=vals.map((v,i)=>`${(p+i*(w-p*2)/Math.max(1,vals.length-1)).toFixed(1)},${(h-p-(v-min)*(h-p*2)/span).toFixed(1)}`).join(' '),positive=(d.roi??(vals.at(-1)-vals[0]))>=0,id=`g${String(t.id).replace(/[^a-zA-Z0-9]/g,'')}${period}`;return`<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${positive?'#8fc52a':'#b03f61'}" stop-opacity=".22"/><stop offset="1" stop-color="${positive?'#8fc52a':'#b03f61'}" stop-opacity="0"/></linearGradient></defs><polygon points="${points} ${w-p},${h-p} ${p},${h-p}" fill="url(#${id})"/><polyline points="${points}" fill="none" stroke="${positive?'#79b900':'#b03f61'}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function performanceHtml(t,period){const d=periodData(t,period),fallback=t.metrics||{},roi=d.available?d.roi:(period==='total'?fallback.roi_pct:null),pnl=d.available?d.pnl:(period==='total'?fallback.pnl_usd:null),positive=(roi||0)>=0,buttons=PERIODS.map(([key,label])=>`<button class="periodbtn ${period===key?'active':''}" data-period="${key}">${label}</button>`).join('');return`<div><div class="perf-label">${d.label}</div><div class="roi ${positive?'':'negative'}">${roi!=null&&positive?'+':''}${pct(roi)}</div><div class="pnl ${(pnl||0)>=0?'':'negative'}">${pnl!=null&&(pnl||0)>=0?'+':''}${money(pnl)}</div><div class="drawdown">最大回撤 ${pct(d.drawdown)}</div></div><div class="chart-panel" data-chart-open="${esc(t.id)}" title="点击查看完整历史曲线">${chartSvg(t,period)}<div class="periods">${buttons}</div><div class="periodnote">${esc(d.source||'')}</div><div class="chart-open-tip">点击曲线查看逐点详情 ›</div></div>`}
function deltaClass(v){return v>0?'up':v<0?'down':'flat'}function signed(v){return v==null?'—':`${v>0?'+':''}${Number(v).toLocaleString('zh-CN',{maximumFractionDigits:1})}`}
function rankText(v){return v==null?'—':v>0?`↑${v}`:v<0?`↓${Math.abs(v)}`:'—'}
function changePanelHtml(t,windowKey){const c=t.changes?.[windowKey],tabs=[['1d','1日'],['7d','7日'],['30d','30日']].map(([key,label])=>`<button class="changebtn ${windowKey===key?'active':''}" data-change="${key}">${label}</button>`).join('');if(!c)return`<div class="change-panel"><div class="change-tabs">${tabs}</div><div class="change-grid"><div class="change"><span>历史积累</span><b class="flat">暂无可比快照</b></div></div></div>`;return`<div class="change-panel"><div class="change-tabs">${tabs}</div><div class="change-grid"><div class="change"><span>AUM变化</span><b class="${deltaClass(c.aum_usd)}">${shortMoney(c.aum_usd)}</b></div><div class="change"><span>当前人数</span><b class="${deltaClass(c.followers)}">${signed(c.followers)}</b></div><div class="change"><span>AUM排名</span><b class="${deltaClass(c.rank_aum)}">${rankText(c.rank_aum)}</b></div><div class="change"><span>估算净流入</span><b class="${deltaClass(c.estimated_net_flow_usd)}">${shortMoney(c.estimated_net_flow_usd)}</b></div></div></div>`}
function alertHtml(t){if(!t.alerts?.length)return'';return`<div class="alerts">${t.alerts.slice(0,4).map(a=>`<span class="alert ${esc(a.category)} ${a.severity==='low'?'low':''}">${esc(a.message)}</span>`).join('')}</div>`}
function cardHtml(t){const m=t.metrics||{},period=selectedPeriods.get(String(t.id))||'total',changeWindow=selectedChanges.get(String(t.id))||'1d';return`<article class="trader-card" data-id="${esc(t.id)}"><div class="cardhead">${avatarHtml(t)}<div><div class="name">${esc(t.name)}</div>${badgesHtml(t)}</div><a class="followbtn" href="${esc(t.profile_url)}" target="_blank" rel="noopener" data-profile>跟单</a></div><div class="performance">${performanceHtml(t,period)}</div><div class="stats"><div><span class="statlabel">当前跟单人数</span><span class="statvalue">${num(m.followers)}${m.followers_capacity!=null?`<span class="capacity">/${num(m.followers_capacity)}</span>`:''}</span></div><div><span class="statlabel">带单规模</span><span class="statvalue">${money(m.aum_usd)}</span></div><div><span class="statlabel">带单天数</span><span class="statvalue">${days(m.lead_days)}</span></div></div>${changePanelHtml(t,changeWindow)}${alertHtml(t)}</article>`}
function alertMatch(t){if(state.alert==='all')return true;if(state.alert==='none')return!t.alerts?.length;return(t.alerts||[]).some(a=>a.category===state.alert)}
function coverageMatch(t){if(state.coverage==='all')return true;if(state.coverage==='curve')return t.is_curve_full;if(state.coverage==='deep')return t.is_deep;return true}
function apply(reset=true){const q=state.query.toLowerCase();visible=raw.filter(t=>{const m=t.metrics||{},text=`${t.name} ${t.unique_code}`.toLowerCase();return(!q||text.includes(q))&&alertMatch(t)&&coverageMatch(t)&&(m.lead_days||0)>=state.age&&(m.aum_usd||0)>=state.minAum&&(m.followers||0)>=state.minFollowers}).sort(sorters[state.sort]);if(reset)renderCount=PAGE_SIZE;render()}
function render(){const page=visible.slice(0,renderCount);$('#cards').innerHTML=page.length?page.map(cardHtml).join(''):'<div class="empty"><b>没有匹配结果</b><span>调整筛选条件后再看</span></div>';$('#loadMore').hidden=renderCount>=visible.length;$('#loadMore').textContent=`继续加载（${Math.min(PAGE_SIZE,visible.length-renderCount)}）`}
function qualityHtml(t){const endpoints=t.data_quality?.endpoints||{};const rows=Object.entries(endpoints);if(!rows.length)return'暂无接口明细';return`<div class="quality-list">${rows.map(([key,value])=>`<div class="quality-item ${value?.ok?'ok':'bad'}">${esc(key)}：${value?.ok?'成功':'失败'}</div>`).join('')}</div>`}
function changeRows(t){return['1d','7d','30d'].map(key=>{const c=t.changes?.[key];return`<tr><td>${key.replace('d','日')}</td><td>${c?shortMoney(c.aum_usd):'—'}</td><td>${c?signed(c.followers):'—'}</td><td>${c?rankText(c.rank_aum):'—'}</td><td>${c?rankText(c.rank_followers):'—'}</td><td>${c?shortMoney(c.estimated_net_flow_usd):'—'}</td></tr>`}).join('')}
function openDetail(id){const t=raw.find(x=>String(x.id)===String(id));if(!t)return;const m=t.metrics||{},stats=[['带单规模',money(m.aum_usd)],['当前跟单人数',num(m.followers)],['带单天数',days(m.lead_days)],['总收益率',pct(m.roi_pct)],['标准最大回撤',pct(m.max_drawdown_pct)],['最高当前杠杆',m.current_max_leverage==null?'—':`${m.current_max_leverage}x`],['曲线覆盖',t.is_curve_full?'OKX完整曲线':'榜单简化曲线'],['深度状态',t.is_deep?'已深度分析':'未深度分析'],['数据状态',t.data_quality?.status||'basic']];const grouped={capital:[],trading:[],data:[]};for(const a of t.alerts||[])grouped[a.category]?.push(a.message);$('#detailContent').innerHTML=`<div class="detailhead"><div><h2>${esc(t.name)}</h2></div><button class="close" onclick="detailDialog.close()">×</button></div><div class="detailgrid">${stats.map(([a,b])=>`<div class="detailstat"><span>${esc(a)}</span><b>${b}</b></div>`).join('')}</div><div class="detailtext"><b>变化指标</b><table class="change-table"><thead><tr><th>周期</th><th>AUM</th><th>人数</th><th>AUM名次</th><th>人数名次</th><th>估算净流入</th></tr></thead><tbody>${changeRows(t)}</tbody></table><small>估算净流入仅用于辅助判断，不是 OKX 官方资金流水。</small></div><div class="detailtext"><b>资金异常</b><br>${grouped.capital.length?grouped.capital.map(esc).join('；'):'未触发'}</div><div class="detailtext"><b>交易风险</b><br>${grouped.trading.length?grouped.trading.map(esc).join('；'):'未触发'}</div><div class="detailtext"><b>数据异常</b><br>${grouped.data.length?grouped.data.map(esc).join('；'):'未触发'}</div><div class="detailtext"><b>接口完整度</b>${qualityHtml(t)}</div><div class="detailtext"><b>其他风险标签</b><br>${esc((t.flags||[]).join('；')||'没有额外标签')}</div><div class="detailactions"><button onclick="detailDialog.close()">返回</button><a href="${esc(t.profile_url)}" target="_blank" rel="noopener">打开主页 / 跟单</a></div>`;detailDialog.showModal()}
$('#cards').addEventListener('click',e=>{const periodBtn=e.target.closest('[data-period]');if(periodBtn){e.preventDefault();e.stopPropagation();const card=periodBtn.closest('.trader-card'),id=card?.dataset.id,t=raw.find(x=>String(x.id)===String(id));if(!t)return;const period=periodBtn.dataset.period;selectedPeriods.set(String(id),period);card.querySelector('.performance').innerHTML=performanceHtml(t,period);return}const changeBtn=e.target.closest('[data-change]');if(changeBtn){e.preventDefault();e.stopPropagation();const card=changeBtn.closest('.trader-card'),id=card?.dataset.id,t=raw.find(x=>String(x.id)===String(id));if(!t)return;const key=changeBtn.dataset.change;selectedChanges.set(String(id),key);card.querySelector('.change-panel').outerHTML=changePanelHtml(t,key);return}const chartOpen=e.target.closest('[data-chart-open]');if(chartOpen){e.preventDefault();e.stopPropagation();const card=chartOpen.closest('.trader-card'),id=card?.dataset.id,selected=selectedPeriods.get(String(id))||'total';location.href=`./chart.html?id=${encodeURIComponent(id)}&period=${encodeURIComponent(selected)}`;return}if(e.target.closest('[data-profile]'))return;const card=e.target.closest('.trader-card');if(card)openDetail(card.dataset.id)});
function openSort(){$('#sortOptions').innerHTML=SORTS.map(([k,l,n])=>`<button class="option ${state.sort===k?'selected':''}" data-sort="${k}"><span>${l}</span>${n?`<small>${n}</small>`:''}</button>`).join('');$$('[data-sort]').forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;$('#sortLabel').textContent=SORTS.find(x=>x[0]===state.sort)[1];sortSheet.close();apply()});sortSheet.showModal()}
$('#sortBtn').onclick=openSort;$('#filterBtn').onclick=()=>filterSheet.showModal();$('#searchBtn').onclick=()=>{$('#searchBox').classList.toggle('show');if($('#searchBox').classList.contains('show'))$('#search').focus()};$('#search').oninput=e=>{state.query=e.target.value.trim();apply()};$('#loadMore').onclick=()=>{renderCount+=PAGE_SIZE;render()};
function activate(selector,key,value){$$(selector).forEach(b=>b.classList.toggle('active',b.dataset[key]===String(value)))}
$$('[data-age]').forEach(b=>b.onclick=()=>{state.age=Number(b.dataset.age);activate('[data-age]','age',state.age)});$$('[data-alert]').forEach(b=>b.onclick=()=>{state.alert=b.dataset.alert;activate('[data-alert]','alert',state.alert)});$$('[data-coverage]').forEach(b=>b.onclick=()=>{state.coverage=b.dataset.coverage;activate('[data-coverage]','coverage',state.coverage)});
$('#resetFilters').onclick=()=>{state.age=0;state.alert='all';state.coverage='all';state.minAum=0;state.minFollowers=0;$('#minAum').value='';$('#minFollowers').value='';activate('[data-age]','age',0);activate('[data-alert]','alert','all');activate('[data-coverage]','coverage','all')};
$('#applyFilters').onclick=()=>{state.minAum=Math.max(0,Number($('#minAum').value)||0);state.minFollowers=Math.max(0,Number($('#minFollowers').value)||0);filterSheet.close();apply()};
[sortSheet,filterSheet].forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
async function load(){try{const stamp=Date.now(),[traderResponse,changeResponse]=await Promise.all([fetch(`./data/traders.json?t=${stamp}`,{cache:'no-store'}),fetch(`./data/changes.json?t=${stamp}`,{cache:'no-store'})]);if(!traderResponse.ok)throw Error(`HTTP ${traderResponse.status}`);payload=await traderResponse.json();raw=payload.traders||[];if(changeResponse.ok){const changes=await changeResponse.json();for(const t of raw)t.changes=changes.traders?.[t.unique_code]||t.changes||{}}buildOfficialIndexes();const generated=payload.generated_at?new Date(payload.generated_at):null,ageHours=generated?(Date.now()-generated.getTime())/36e5:Infinity;$('#meta').textContent=`更新 ${generated?generated.toLocaleString('zh-CN'):'—'} · 榜单 ${payload.leaderboard_count??raw.length} 人 · 完整曲线 ${payload.curve_count??0} 人 · 深度 ${payload.detail_count??0} 人${ageHours>24?' · 数据已超过24小时':''}`;const health=payload.dataset_health||{};if(health.alerts?.length){$('#health').classList.add('show');$('#health').textContent=health.alerts.map(x=>x.message).join('；')}apply()}catch(e){$('#meta').textContent=`数据读取失败：${e.message}`;$('#cards').innerHTML='<div class="empty"><b>数据读取失败</b><span>稍后刷新页面</span></div>'}}
load();
</script>
</body>
</html>
