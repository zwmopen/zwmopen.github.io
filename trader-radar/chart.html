<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="description" content="OKX 带单交易员完整历史收益曲线与逐点统计">
  <title>交易员历史曲线</title>
  <style>
    :root{color-scheme:dark;--bg:#090b0e;--panel:#111419;--panel2:#171b21;--line:#252b33;--ink:#f6f7f8;--muted:#8f98a5;--green:#88c63f;--red:#d95f82;--blue:#5b9cff;--amber:#d7a54a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,a{font:inherit;color:inherit}button{cursor:pointer}.page{min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 18px;background:rgba(9,11,14,.94);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.back,.rotate,.export{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 14px;font-weight:750}.back{width:40px;padding:0;font-size:23px}.headtext{min-width:0;flex:1}.headtext h1{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.headtext p{margin:4px 0 0;color:var(--muted);font-size:11px}.head-actions{display:flex;gap:8px}.open-okx{height:40px;display:grid;place-items:center;padding:0 15px;border-radius:999px;background:#fff;color:#060708;text-decoration:none;font-weight:850;white-space:nowrap}
    .wrap{width:min(100%,1280px);margin:auto;padding:18px}.current-grid,.summary-grid,.point-grid{display:grid;gap:10px}.current-grid{grid-template-columns:repeat(6,1fr)}.summary-grid{grid-template-columns:repeat(6,1fr);margin-top:12px}.point-grid{grid-template-columns:repeat(6,1fr);margin-top:12px}.metric{min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.metric span{display:block;color:var(--muted);font-size:10px}.metric b{display:block;margin-top:6px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric b.positive{color:var(--green)}.metric b.negative{color:var(--red)}
    .periodbar{display:flex;gap:7px;margin:16px 0 10px;overflow:auto;scrollbar-width:none}.periodbar::-webkit-scrollbar{display:none}.periodbtn{min-width:58px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-weight:800}.periodbtn.active{background:#fff;color:#050607;border-color:#fff}.source-note{margin:0 0 12px;color:var(--muted);font-size:11px}.warning{display:none;margin-bottom:12px;padding:11px 13px;border-radius:12px;background:#2a2011;color:#e8ba62;font-size:12px}.warning.show{display:block}
    .chart-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.chart-card,.selected-card,.table-card{border:1px solid var(--line);border-radius:18px;background:var(--panel);overflow:hidden}.chart-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.chart-head h2{margin:0;font-size:15px}.chart-head small{color:var(--muted)}.canvas-wrap{position:relative;height:440px;min-height:300px;background:linear-gradient(180deg,#11151b,#0c0f13);touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair;outline:none}.drag-tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.62);color:#c9cdd3;font-size:10px;pointer-events:none}.selected-card{padding:16px}.selected-card h2{margin:0;font-size:16px}.selected-date{margin-top:5px;color:var(--blue);font-size:13px;font-weight:760}.selected-list{display:grid;gap:9px;margin-top:16px}.selected-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}.selected-row span{color:var(--muted);font-size:11px}.selected-row b{font-size:13px;text-align:right}.selected-note{margin-top:14px;color:var(--muted);font-size:10px;line-height:1.6}
    .section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}.section-title h2{margin:0;font-size:17px}.section-title small{color:var(--muted)}.table-card{max-height:480px;overflow:auto}.point-table{width:100%;border-collapse:collapse;min-width:780px}.point-table th{position:sticky;top:0;z-index:2;background:#171b21;color:var(--muted);font-size:10px;text-align:right}.point-table th:first-child,.point-table td:first-child{text-align:left}.point-table th,.point-table td{padding:11px 13px;border-bottom:1px solid var(--line)}.point-table td{font-size:11px;text-align:right}.point-table tr{cursor:pointer}.point-table tbody tr:hover,.point-table tbody tr.selected{background:#1c222a}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:8px}
    @media(max-width:980px){.current-grid,.summary-grid,.point-grid{grid-template-columns:repeat(3,1fr)}.chart-layout{grid-template-columns:1fr}.selected-card{display:grid;grid-template-columns:180px 1fr;gap:18px}.selected-list{grid-template-columns:repeat(3,1fr);margin-top:0}.selected-row{display:block}.selected-row b{display:block;margin-top:5px;text-align:left}.canvas-wrap{height:390px}}
    @media(max-width:620px){.wrap{padding:12px}.topbar{padding:8px 10px}.rotate{display:none}.open-okx{padding:0 12px}.current-grid,.summary-grid,.point-grid{grid-template-columns:repeat(2,1fr)}.metric{padding:11px}.metric b{font-size:14px}.chart-layout{gap:9px}.canvas-wrap{height:360px}.selected-card{display:block}.selected-list{display:grid;grid-template-columns:repeat(2,1fr);margin-top:14px}.point-table{min-width:720px}}
    @media(orientation:landscape) and (max-height:620px){.topbar{min-height:50px;padding-top:5px;padding-bottom:5px}.wrap{padding:10px 14px}.current-grid{display:none}.periodbar{margin:8px 0}.source-note,.warning{margin-bottom:7px}.chart-layout{grid-template-columns:minmax(0,1fr) 270px}.canvas-wrap{height:calc(100vh - 138px);min-height:260px}.selected-card{display:block;padding:12px}.selected-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}.selected-row{display:block;padding-bottom:6px}.selected-row b{display:block;margin-top:3px;text-align:left}.summary-grid,.section-title,.table-card{display:none}}
  </style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="返回">‹</button>
    <div class="headtext"><h1 id="traderName">历史收益曲线</h1><p id="subtitle">正在读取 OKX 原始时间点</p></div>
    <div class="head-actions"><button class="rotate" id="rotateBtn">横屏查看</button><a class="open-okx" id="okxLink" target="_blank" rel="noopener">打开 OKX</a></div>
  </header>
  <main class="wrap" id="content">
    <section class="current-grid" id="currentGrid"></section>
    <nav class="periodbar" id="periodBar"></nav>
    <p class="source-note" id="sourceNote"></p>
    <div class="warning" id="warning"></div>
    <section class="chart-layout">
      <div class="chart-card">
        <div class="chart-head"><h2 id="chartTitle">收益率历史</h2><small id="pointCount">—</small></div>
        <div class="canvas-wrap"><canvas id="chart" tabindex="0" aria-label="可拖动查看每个历史时间点"></canvas><div class="drag-tip">横屏后左右拖动竖线，查看每一个原始时间点</div></div>
      </div>
      <aside class="selected-card">
        <div><h2>选中时间点</h2><div class="selected-date" id="selectedDate">—</div></div>
        <div class="selected-list">
          <div class="selected-row"><span>累计收益率</span><b id="selectedRoi">—</b></div>
          <div class="selected-row"><span>累计收益额</span><b id="selectedPnl">—</b></div>
          <div class="selected-row"><span>较上一点变化</span><b id="selectedDelta">—</b></div>
          <div class="selected-row"><span>收益额变化</span><b id="selectedPnlDelta">—</b></div>
          <div class="selected-row"><span>当时回撤</span><b id="selectedDrawdown">—</b></div>
          <div class="selected-row"><span>数据点位置</span><b id="selectedIndex">—</b></div>
        </div>
        <p class="selected-note">历史曲线点来自 OKX 收益接口。历史时间点不包含当时的 AUM、跟单人数和持仓快照，因此这些字段只在上方显示当前值。</p>
      </aside>
    </section>
    <section class="summary-grid" id="summaryGrid"></section>
    <div class="section-title"><h2>全部时间点明细</h2><div><small>点击任意一行可定位竖线</small> <button class="export" id="exportBtn">导出 CSV</button></div></div>
    <section class="table-card"><table class="point-table"><thead><tr><th>时间</th><th>累计收益率</th><th>累计收益额</th><th>单点收益变化</th><th>收益额变化</th><th>当时回撤</th></tr></thead><tbody id="pointRows"></tbody></table></section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s);
const params=new URLSearchParams(location.search);
const traderId=params.get('id')||params.get('code')||'';
const PERIODS=[['total','总'],['year','年'],['month','月'],['week','周'],['day','日']];
const PERIOD_LABELS={total:'完整历史',year:'最近1年',month:'最近30日',week:'OKX原生周线',day:'最近1日'};
const moneyFmt=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const numFmt=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
let trader=null,period=params.get('period')||'total',series=[],selectedIndex=0,dragging=false,geometry=null;
const canvas=$('#chart'),ctx=canvas.getContext('2d');
const money=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v)>=0?'+':'-'}$${moneyFmt.format(Math.abs(Number(v)))}`;
const plainMoney=v=>v==null||!Number.isFinite(Number(v))?'—':`$${moneyFmt.format(Number(v))}`;
const pct=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v)>0?'+':''}${Number(v).toFixed(2)}%`;
const pp=v=>v==null||!Number.isFinite(Number(v))?'—':`${Number(v)>0?'+':''}${Number(v).toFixed(2)}pp`;
const cls=v=>Number(v)>0?'positive':Number(v)<0?'negative':'';
const escapeHtml=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function parseSeries(raw){return(raw||[]).map((item,index)=>({time:item.time?Date.parse(item.time):NaN,timeText:item.time||'',roi:Number(item.roi_pct),pnl:item.pnl_usd==null?null:Number(item.pnl_usd),index})).filter(item=>Number.isFinite(item.roi)&&Number.isFinite(item.time)).sort((a,b)=>a.time-b.time)}
function getSeries(key){let rows=parseSeries(key==='week'?trader.weekly_roi_series:trader.roi_series);if(!rows.length)return[];if(key==='day')return rows.slice(-2);if(key==='year'||key==='month'){const days=key==='year'?365:30,cutoff=rows.at(-1).time-days*86400000;rows=rows.filter(item=>item.time>=cutoff)}return rows}
function dateText(ms,long=false){const d=new Date(ms);return d.toLocaleString('zh-CN',long?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}:{year:'numeric',month:'2-digit',day:'2-digit'})}
function navValue(roi){return Math.max(1e-9,1+roi/100)}
function drawdowns(rows){let peak=navValue(rows[0]?.roi||0);return rows.map(item=>{const nav=navValue(item.roi);peak=Math.max(peak,nav);return(peak-nav)/peak*100})}
function summary(rows){if(rows.length<2)return{ret:null,pnl:null,maxDd:null,best:null,worst:null,positive:null,start:null,end:null};const dds=drawdowns(rows),steps=rows.slice(1).map((item,i)=>item.roi-rows[i].roi),startNav=navValue(rows[0].roi),endNav=navValue(rows.at(-1).roi);const pnl=rows[0].pnl!=null&&rows.at(-1).pnl!=null?rows.at(-1).pnl-rows[0].pnl:null;return{ret:(endNav/startNav-1)*100,pnl,maxDd:Math.max(...dds),best:Math.max(...steps),worst:Math.min(...steps),positive:steps.length?steps.filter(x=>x>=0).length/steps.length*100:null,start:rows[0].time,end:rows.at(-1).time}}
function metric(label,value,className=''){return`<div class="metric"><span>${escapeHtml(label)}</span><b class="${className}">${value}</b></div>`}
function renderCurrent(){const m=trader.metrics||{};$('#currentGrid').innerHTML=[metric('当前带单规模',plainMoney(m.aum_usd)),metric('当前跟单人数',m.followers==null?'—':Math.round(m.followers).toLocaleString('en-US')),metric('带单天数',m.lead_days==null?'—':Math.round(m.lead_days).toLocaleString('en-US')),metric('当前持仓数量',m.current_positions_count==null?'—':m.current_positions_count),metric('当前最高杠杆',m.current_max_leverage==null?'—':`${m.current_max_leverage}x`),metric('当前持仓浮盈亏',pct(m.current_upl_pct),cls(m.current_upl_pct))].join('')}
function renderPeriods(){$('#periodBar').innerHTML=PERIODS.map(([key,label])=>`<button class="periodbtn ${key===period?'active':''}" data-period="${key}">${label}</button>`).join('')}
function renderSummary(){const s=summary(series);$('#summaryGrid').innerHTML=[metric('区间收益率',pct(s.ret),cls(s.ret)),metric('区间收益额变化',money(s.pnl),cls(s.pnl)),metric('标准最大回撤',pct(s.maxDd),'negative'),metric('最佳单点变化',pp(s.best),cls(s.best)),metric('最差单点变化',pp(s.worst),cls(s.worst)),metric('上涨时间点占比',pct(s.positive),cls((s.positive||0)-50))].join('');$('#chartTitle').textContent=`${PERIOD_LABELS[period]}收益曲线`;$('#pointCount').textContent=`${series.length} 个原始时间点`;const meta=trader.period_metrics?.[period];$('#sourceNote').textContent=`数据来源：${meta?.source||($('#warning').classList.contains('show')?'OKX 排行榜简化曲线':'OKX 原始收益曲线')} · 时间范围：${s.start?dateText(s.start):'—'} 至 ${s.end?dateText(s.end):'—'}`}
function pointStats(index){const item=series[index],prev=series[index-1],dds=drawdowns(series);return{item,roiDelta:prev?item.roi-prev.roi:null,pnlDelta:prev&&item.pnl!=null&&prev.pnl!=null?item.pnl-prev.pnl:null,drawdown:dds[index]}}
function selectPoint(index,redraw=true){if(!series.length)return;selectedIndex=Math.max(0,Math.min(series.length-1,index));const s=pointStats(selectedIndex),item=s.item;$('#selectedDate').textContent=dateText(item.time,true);$('#selectedRoi').textContent=pct(item.roi);$('#selectedRoi').className=cls(item.roi);$('#selectedPnl').textContent=money(item.pnl);$('#selectedPnl').className=cls(item.pnl);$('#selectedDelta').textContent=pp(s.roiDelta);$('#selectedDelta').className=cls(s.roiDelta);$('#selectedPnlDelta').textContent=money(s.pnlDelta);$('#selectedPnlDelta').className=cls(s.pnlDelta);$('#selectedDrawdown').textContent=pct(s.drawdown);$('#selectedDrawdown').className=s.drawdown>0?'negative':'';$('#selectedIndex').textContent=`${selectedIndex+1} / ${series.length}`;document.querySelectorAll('#pointRows tr').forEach((row,i)=>row.classList.toggle('selected',i===selectedIndex));if(redraw)drawChart()}
function renderRows(){const dds=drawdowns(series);$('#pointRows').innerHTML=series.map((item,index)=>{const prev=series[index-1],roiDelta=prev?item.roi-prev.roi:null,pnlDelta=prev&&item.pnl!=null&&prev.pnl!=null?item.pnl-prev.pnl:null;return`<tr data-index="${index}"><td>${escapeHtml(dateText(item.time,true))}</td><td class="${cls(item.roi)}">${pct(item.roi)}</td><td class="${cls(item.pnl)}">${money(item.pnl)}</td><td class="${cls(roiDelta)}">${pp(roiDelta)}</td><td class="${cls(pnlDelta)}">${money(pnlDelta)}</td><td class="negative">${pct(dds[index])}</td></tr>`}).join('')}
function drawChart(){const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1),width=Math.max(320,rect.width),height=Math.max(240,rect.height);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,width,height);if(series.length<2){ctx.fillStyle='#8f98a5';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('该周期没有足够的真实时间点',width/2,height/2);geometry=null;return}const margin={left:54,right:18,top:22,bottom:34},plotW=width-margin.left-margin.right,plotH=height-margin.top-margin.bottom,values=series.map(x=>x.roi),minValue=Math.min(...values),maxValue=Math.max(...values),rawSpan=maxValue-minValue||1,pad=rawSpan*.12,min=minValue-pad,max=maxValue+pad,span=max-min||1,x=i=>margin.left+i*plotW/(series.length-1),y=v=>margin.top+(max-v)/span*plotH;geometry={margin,plotW,plotH,width,height,x};ctx.strokeStyle='#252b33';ctx.lineWidth=1;ctx.font='10px system-ui';ctx.fillStyle='#7f8995';ctx.textAlign='right';for(let i=0;i<=4;i++){const yy=margin.top+i*plotH/4,value=max-i*span/4;ctx.beginPath();ctx.moveTo(margin.left,yy);ctx.lineTo(width-margin.right,yy);ctx.stroke();ctx.fillText(`${value.toFixed(1)}%`,margin.left-8,yy+3)}if(min<=0&&max>=0){const zy=y(0);ctx.strokeStyle='#59616c';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(margin.left,zy);ctx.lineTo(width-margin.right,zy);ctx.stroke();ctx.setLineDash([])}const positive=series.at(-1).roi>=series[0].roi,lineColor=positive?'#88c63f':'#d95f82';const gradient=ctx.createLinearGradient(0,margin.top,0,height-margin.bottom);gradient.addColorStop(0,positive?'rgba(136,198,63,.28)':'rgba(217,95,130,.28)');gradient.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();series.forEach((item,i)=>{const xx=x(i),yy=y(item.roi);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)});ctx.lineTo(x(series.length-1),height-margin.bottom);ctx.lineTo(x(0),height-margin.bottom);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();series.forEach((item,i)=>{const xx=x(i),yy=y(item.roi);if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)});ctx.strokeStyle=lineColor;ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();const selected=series[selectedIndex],sx=x(selectedIndex),sy=y(selected.roi);ctx.strokeStyle='#f5f7fa';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(sx,margin.top);ctx.lineTo(sx,height-margin.bottom);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fillStyle=lineColor;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#7f8995';ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText(dateText(series[0].time),margin.left,height-10);ctx.textAlign='right';ctx.fillText(dateText(series.at(-1).time),width-margin.right,height-10)}
function pointerIndex(event){if(!geometry||series.length<2)return 0;const rect=canvas.getBoundingClientRect(),localX=event.clientX-rect.left,ratio=(localX-geometry.margin.left)/geometry.plotW;return Math.round(Math.max(0,Math.min(1,ratio))*(series.length-1))}
function switchPeriod(key){period=key;series=getSeries(key);selectedIndex=Math.max(0,series.length-1);renderPeriods();renderSummary();renderRows();selectPoint(selectedIndex);history.replaceState(null,'',`?id=${encodeURIComponent(traderId)}&period=${encodeURIComponent(period)}`)}
function exportCsv(){if(!series.length)return;const dds=drawdowns(series),rows=[['time','roi_pct','pnl_usd','roi_change_pp','pnl_change_usd','drawdown_pct']];series.forEach((item,index)=>{const prev=series[index-1];rows.push([item.timeText,item.roi,item.pnl??'',prev?item.roi-prev.roi:'',prev&&item.pnl!=null&&prev.pnl!=null?item.pnl-prev.pnl:'',dds[index]])});const csv='\ufeff'+rows.map(row=>row.map(value=>`"${String(value).replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${trader.name}-${period}-history.csv`;a.click();URL.revokeObjectURL(url)}
async function requestLandscape(){try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch(e){$('#rotateBtn').textContent='请手动横屏'}}
function showError(message){$('#content').innerHTML=`<div class="empty"><b>历史曲线读取失败</b><span>${escapeHtml(message)}</span></div>`}
async function load(){try{if(!traderId)throw Error('链接中缺少交易员代码');const response=await fetch(`./data/traders.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);const payload=await response.json();trader=(payload.traders||[]).find(item=>String(item.id)===traderId||String(item.unique_code)===traderId);if(!trader)throw Error('当前榜单中没有找到该交易员');document.title=`${trader.name}｜历史收益曲线`;$('#traderName').textContent=trader.name;$('#subtitle').textContent=`${trader.is_curve_full?'OKX 完整历史曲线':'OKX 排行榜简化曲线'} · ${trader.unique_code}`;$('#okxLink').href=trader.profile_url||'#';renderCurrent();if(!trader.is_curve_full){$('#warning').classList.add('show');$('#warning').textContent='该账户暂未进入完整曲线采集范围，目前只能展示 OKX 排行榜提供的简化曲线，不能代表从开始带单至今的全部历史。'}switchPeriod(PERIODS.some(x=>x[0]===period)?period:'total')}catch(error){showError(error.message)}}
$('#backBtn').onclick=()=>history.length>1?history.back():location.assign('./');$('#rotateBtn').onclick=requestLandscape;$('#exportBtn').onclick=exportCsv;$('#periodBar').addEventListener('click',event=>{const button=event.target.closest('[data-period]');if(button)switchPeriod(button.dataset.period)});$('#pointRows').addEventListener('click',event=>{const row=event.target.closest('[data-index]');if(!row)return;selectPoint(Number(row.dataset.index));canvas.scrollIntoView({behavior:'smooth',block:'center'})});canvas.addEventListener('pointerdown',event=>{dragging=true;canvas.setPointerCapture?.(event.pointerId);selectPoint(pointerIndex(event))});canvas.addEventListener('pointermove',event=>{if(dragging||event.pointerType==='mouse')selectPoint(pointerIndex(event))});canvas.addEventListener('pointerup',event=>{dragging=false;canvas.releasePointerCapture?.(event.pointerId)});canvas.addEventListener('pointercancel',()=>dragging=false);canvas.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'){event.preventDefault();selectPoint(selectedIndex-1)}if(event.key==='ArrowRight'){event.preventDefault();selectPoint(selectedIndex+1)}});window.addEventListener('resize',()=>requestAnimationFrame(drawChart));load();
</script>
</body>
</html>
