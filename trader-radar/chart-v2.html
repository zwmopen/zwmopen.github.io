<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0e">
<meta name="description" content="OKX 带单交易员年、月、周、日收益曲线与逐点统计">
<link rel="icon" type="image/svg+xml" href="../crypto-radar/favicon.svg">
<title>交易员周期曲线</title>
<style>
:root{color-scheme:dark;--bg:#090b0e;--panel:#11151a;--panel2:#171c22;--line:#293039;--ink:#f5f7f8;--muted:#8e98a5;--green:#88c63f;--red:#d95f82;--blue:#68a6ff;font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}button,a{font:inherit;color:inherit}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;min-height:62px;padding:9px 15px;background:rgba(9,11,14,.95);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.round,.pill{height:40px;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-weight:800}.round{width:40px;padding:0;font-size:23px}.pill{padding:0 14px}.head{min-width:0;flex:1}.head h1{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head p{margin:3px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px}.okx{height:40px;padding:0 15px;border-radius:999px;display:grid;place-items:center;background:#fff;color:#070809;text-decoration:none;font-weight:900}.wrap{width:min(100%,1280px);margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.metric{min-width:0;padding:12px 13px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}.metric span{display:block;color:var(--muted);font-size:9px}.metric b{display:block;margin-top:5px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.periods{display:flex;gap:7px;margin:15px 0 9px;overflow:auto;scrollbar-width:none}.periods::-webkit-scrollbar{display:none}.period{min-width:62px;height:36px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted);font-weight:850}.period.active{background:#fff;color:#050607;border-color:#fff}.notice{margin:0 0 11px;padding:10px 12px;border-radius:11px;background:#151a20;color:#aab2bc;font-size:11px;line-height:1.55}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:11px}.card{border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}.chart-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line)}.chart-head h2{margin:0;font-size:15px}.chart-head small{color:var(--muted)}.canvas-wrap{position:relative;height:455px;min-height:300px;background:linear-gradient(180deg,#11161c,#0c0f13);touch-action:none}.canvas-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none;outline:none}.tip{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.65);color:#c9cfd6;font-size:9px;pointer-events:none}.side{padding:15px}.side h2{margin:0;font-size:15px}.date{margin-top:5px;color:var(--blue);font-weight:800;font-size:12px}.rows{display:grid;gap:8px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}.row span{color:var(--muted);font-size:10px}.row b{font-size:12px;text-align:right}.side-note{margin:12px 0 0;color:var(--muted);font-size:9px;line-height:1.6}.summary{margin-top:11px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0 9px}.section h2{margin:0;font-size:16px}.section small{color:var(--muted)}.table-card{max-height:490px;overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}table{width:100%;min-width:820px;border-collapse:collapse}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:10px}th{position:sticky;top:0;z-index:2;background:var(--panel2);color:var(--muted)}th:first-child,td:first-child{text-align:left}tbody tr{cursor:pointer}tbody tr:hover,tbody tr.selected{background:#1b222a}.empty{padding:90px 20px;text-align:center;color:var(--muted)}.empty b{display:block;margin-bottom:8px;color:var(--ink);font-size:18px}
@media(max-width:980px){.grid{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:170px 1fr;gap:15px}.rows{grid-template-columns:repeat(3,1fr);margin-top:0}.row{display:block}.row b{display:block;margin-top:4px;text-align:left}.canvas-wrap{height:390px}}@media(max-width:620px){.wrap{padding:11px}.top{padding:7px 9px}.landscape{display:none}.okx{padding:0 11px}.grid{grid-template-columns:repeat(2,1fr)}.metric{padding:10px}.metric b{font-size:13px}.canvas-wrap{height:355px}.side{display:block}.rows{grid-template-columns:repeat(2,1fr);margin-top:13px}.table-card{border-radius:12px}}@media(orientation:landscape) and (max-height:640px){.top{min-height:48px;padding-top:4px;padding-bottom:4px}.wrap{padding:8px 12px}.current,.summary,.section,.table-card{display:none}.periods{margin:6px 0}.notice{margin-bottom:6px;padding:7px 10px}.layout{grid-template-columns:minmax(0,1fr) 285px}.canvas-wrap{height:calc(100vh - 125px);min-height:250px}.side{display:block;padding:11px}.rows{grid-template-columns:repeat(2,1fr);gap:5px;margin-top:9px}.row{padding-bottom:5px}.side-note{display:none}}
</style>
</head>
<body>
<header class="top"><button class="round" id="back">‹</button><div class="head"><h1 id="name">交易员周期曲线</h1><p id="sub">正在读取 OKX 周期数据</p></div><div class="actions"><button class="pill landscape" id="landscape">横屏</button><a class="okx" id="okx" target="_blank" rel="noopener">打开 OKX</a></div></header>
<main class="wrap" id="main">
<section class="grid current" id="current"></section>
<nav class="periods" id="periods"></nav>
<div class="notice" id="notice">OKX 公开页面提供年、月、周、日周期；本页不再展示或拼接“总历史”。</div>
<section class="layout">
<div class="card"><div class="chart-head"><h2 id="title">近1年收益曲线</h2><small id="count">—</small></div><div class="canvas-wrap"><canvas id="chart" tabindex="0"></canvas><div class="tip">左右拖动竖线查看每个真实时间点</div></div></div>
<aside class="card side"><div><h2>选中时间点</h2><div class="date" id="date">—</div></div><div class="rows"><div class="row"><span>累计收益率</span><b id="roi">—</b></div><div class="row"><span>累计收益额</span><b id="pnl">—</b></div><div class="row"><span>较上一点变化</span><b id="delta">—</b></div><div class="row"><span>收益额变化</span><b id="pnlDelta">—</b></div><div class="row"><span>当时回撤</span><b id="dd">—</b></div><div class="row"><span>点位 / 粒度</span><b id="idx">—</b></div></div><p class="side-note">时间点来自 OKX 对应周期的收益接口，不插值、不补点。历史 AUM、跟单人数及持仓状态不包含在该曲线接口中。</p></aside>
</section>
<section class="grid summary" id="summary"></section>
<div class="section"><h2>当前周期全部时间点</h2><div><small>点击一行定位</small> <button class="pill" id="csv">导出 CSV</button></div></div>
<div class="table-card"><table><thead><tr><th>时间</th><th>粒度</th><th>累计收益率</th><th>累计收益额</th><th>单点变化</th><th>收益额变化</th><th>当时回撤</th></tr></thead><tbody id="tbody"></tbody></table></div>
</main>
<script>
const $=s=>document.querySelector(s),DAY=86400000,params=new URLSearchParams(location.search),id=params.get('id')||params.get('code')||'';
const PERIODS=[['year','年'],['month','月'],['week','周'],['day','日']],LABEL={year:'近1年',month:'近30日',week:'OKX原生周线',day:'最近1日'};
let payload,trader,period=PERIODS.some(x=>x[0]===params.get('period'))?params.get('period'):'year',series=[],selected=0,drag=false,geo=null;
const canvas=$('#chart'),ctx=canvas.getContext('2d'),moneyFmt=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>v==null||!Number.isFinite(+v)?'—':`${+v>=0?'+':'-'}$${moneyFmt.format(Math.abs(+v))}`,plainMoney=v=>v==null||!Number.isFinite(+v)?'—':`$${moneyFmt.format(+v)}`,pct=v=>v==null||!Number.isFinite(+v)?'—':`${+v>0?'+':''}${(+v).toFixed(2)}%`,plainPct=v=>v==null||!Number.isFinite(+v)?'—':`${(+v).toFixed(2)}%`,pp=v=>v==null||!Number.isFinite(+v)?'—':`${+v>0?'+':''}${(+v).toFixed(2)}pp`,klass=v=>+v>0?'positive':+v<0?'negative':'',esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function parse(raw,granularity){return(raw||[]).map(x=>({time:x.time?Date.parse(x.time):NaN,timeText:x.time||'',roi:Number(x.roi_pct),pnl:x.pnl_usd==null?null:Number(x.pnl_usd),granularity})).filter(x=>Number.isFinite(x.time)&&Number.isFinite(x.roi)).sort((a,b)=>a.time-b.time)}
function daily(){return parse(trader.roi_series,'日')}
function weekly(){return parse(trader.weekly_roi_series,'周')}
function getSeries(key){if(key==='week')return weekly();let rows=daily();if(key==='day')return rows.slice(-2);if(key==='year'||key==='month'){const days=key==='year'?365:30;if(!rows.length)return[];const cutoff=rows.at(-1).time-days*DAY;rows=rows.filter(x=>x.time>=cutoff)}return rows}
function dateText(ms,long=false){return new Date(ms).toLocaleString('zh-CN',long?{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}:{year:'numeric',month:'2-digit',day:'2-digit'})}
function nav(roi){return Math.max(1e-9,1+roi/100)}
function drawdowns(rows){let peak=nav(rows[0]?.roi||0);return rows.map(x=>{const n=nav(x.roi);peak=Math.max(peak,n);return(peak-n)/peak*100})}
function stats(rows){if(rows.length<2)return{ret:null,pnl:null,maxDd:null,best:null,worst:null,up:null};const dds=drawdowns(rows),steps=rows.slice(1).map((x,i)=>x.roi-rows[i].roi),pnl=rows[0].pnl!=null&&rows.at(-1).pnl!=null?rows.at(-1).pnl-rows[0].pnl:null;return{ret:(nav(rows.at(-1).roi)/nav(rows[0].roi)-1)*100,pnl,maxDd:Math.max(...dds),best:Math.max(...steps),worst:Math.min(...steps),up:steps.filter(x=>x>=0).length/steps.length*100}}
function metric(label,value,c=''){return`<div class="metric"><span>${esc(label)}</span><b class="${c}">${value}</b></div>`}
function renderCurrent(){const m=trader.metrics||{};$('#current').innerHTML=[metric('当前带单规模',plainMoney(m.aum_usd)),metric('当前跟单人数',m.followers==null?'—':Math.round(m.followers).toLocaleString()),metric('带单天数',m.lead_days==null?'—':Math.round(m.lead_days).toLocaleString()),metric('当前持仓数',m.current_positions_count??'—'),metric('当前最高杠杆',m.current_max_leverage==null?'—':`${m.current_max_leverage}x`),metric('当前持仓浮盈亏',pct(m.current_upl_pct),klass(m.current_upl_pct))].join('')}
function renderPeriods(){$('#periods').innerHTML=PERIODS.map(([k,l])=>`<button class="period ${k===period?'active':''}" data-period="${k}">${l}</button>`).join('')}
function renderNotice(){const first=series[0],last=series.at(-1),source=trader.period_metrics?.[period]?.source||'OKX周期曲线';$('#notice').textContent=`${source}：${first?dateText(first.time):'—'} 至 ${last?dateText(last.time):'—'}，共 ${series.length} 个真实时间点。OKX 当前没有提供可确认的“从开始带单至今”总历史接口。`}
function renderSummary(){const s=stats(series);$('#summary').innerHTML=[metric('区间收益率',pct(s.ret),klass(s.ret)),metric('区间收益额变化',money(s.pnl),klass(s.pnl)),metric('标准最大回撤',plainPct(s.maxDd),'negative'),metric('最佳单点变化',pp(s.best),klass(s.best)),metric('最差单点变化',pp(s.worst),klass(s.worst)),metric('上涨点占比',plainPct(s.up),klass((s.up||0)-50))].join('');$('#title').textContent=`${LABEL[period]}收益曲线`;$('#count').textContent=`${series.length} 个原始时间点`}
function point(i){const item=series[i],prev=series[i-1],dds=drawdowns(series);return{item,delta:prev?item.roi-prev.roi:null,pnlDelta:prev&&item.pnl!=null&&prev.pnl!=null?item.pnl-prev.pnl:null,dd:dds[i]}}
function select(i,draw=true){if(!series.length)return;selected=Math.max(0,Math.min(series.length-1,i));const p=point(selected);$('#date').textContent=dateText(p.item.time,true);for(const [sel,val] of [['#roi',pct(p.item.roi)],['#pnl',money(p.item.pnl)],['#delta',pp(p.delta)],['#pnlDelta',money(p.pnlDelta)],['#dd',plainPct(p.dd)]])$(sel).textContent=val;$('#roi').className=klass(p.item.roi);$('#pnl').className=klass(p.item.pnl);$('#delta').className=klass(p.delta);$('#pnlDelta').className=klass(p.pnlDelta);$('#dd').className=p.dd>0?'negative':'';$('#idx').textContent=`${selected+1} / ${series.length} · ${p.item.granularity}`;document.querySelectorAll('#tbody tr').forEach((r,n)=>r.classList.toggle('selected',n===selected));if(draw)drawChart()}
function renderTable(){const dds=drawdowns(series);$('#tbody').innerHTML=series.map((x,i)=>{const prev=series[i-1],delta=prev?x.roi-prev.roi:null,pd=prev&&x.pnl!=null&&prev.pnl!=null?x.pnl-prev.pnl:null;return`<tr data-i="${i}"><td>${esc(dateText(x.time,true))}</td><td>${x.granularity}</td><td class="${klass(x.roi)}">${pct(x.roi)}</td><td class="${klass(x.pnl)}">${money(x.pnl)}</td><td class="${klass(delta)}">${pp(delta)}</td><td class="${klass(pd)}">${money(pd)}</td><td class="negative">${plainPct(dds[i])}</td></tr>`}).join('')}
function drawChart(){const rect=canvas.getBoundingClientRect(),dpr=Math.max(1,devicePixelRatio||1),W=Math.max(320,rect.width),H=Math.max(240,rect.height);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);if(series.length<2){ctx.fillStyle='#8e98a5';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText('该周期没有足够的真实时间点',W/2,H/2);geo=null;return}const m={l:55,r:18,t:22,b:34},pw=W-m.l-m.r,ph=H-m.t-m.b,vals=series.map(x=>x.roi),raw=Math.max(...vals)-Math.min(...vals)||1,pad=raw*.12,min=Math.min(...vals)-pad,max=Math.max(...vals)+pad,span=max-min||1,x=i=>m.l+i*pw/(series.length-1),y=v=>m.t+(max-v)/span*ph;geo={m,pw};ctx.font='10px system-ui';ctx.fillStyle='#7d8793';ctx.textAlign='right';for(let i=0;i<=4;i++){const yy=m.t+i*ph/4,val=max-i*span/4;ctx.strokeStyle='#293039';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(m.l,yy);ctx.lineTo(W-m.r,yy);ctx.stroke();ctx.fillText(`${val.toFixed(1)}%`,m.l-7,yy+3)}if(min<=0&&max>=0){const yy=y(0);ctx.strokeStyle='#626b76';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(m.l,yy);ctx.lineTo(W-m.r,yy);ctx.stroke();ctx.setLineDash([])}const up=series.at(-1).roi>=series[0].roi,color=up?'#88c63f':'#d95f82',grad=ctx.createLinearGradient(0,m.t,0,H-m.b);grad.addColorStop(0,up?'rgba(136,198,63,.27)':'rgba(217,95,130,.27)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.beginPath();series.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.roi)):ctx.moveTo(x(i),y(p.roi)));ctx.lineTo(x(series.length-1),H-m.b);ctx.lineTo(x(0),H-m.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();ctx.beginPath();series.forEach((p,i)=>i?ctx.lineTo(x(i),y(p.roi)):ctx.moveTo(x(i),y(p.roi)));ctx.strokeStyle=color;ctx.lineWidth=2.4;ctx.lineJoin='round';ctx.stroke();const sx=x(selected),sy=y(series[selected].roi);ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(sx,m.t);ctx.lineTo(sx,H-m.b);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(sx,sy,5,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#7d8793';ctx.font='10px system-ui';ctx.textAlign='left';ctx.fillText(dateText(series[0].time),m.l,H-10);ctx.textAlign='right';ctx.fillText(dateText(series.at(-1).time),W-m.r,H-10)}
function indexFromEvent(e){if(!geo||series.length<2)return 0;const r=canvas.getBoundingClientRect(),ratio=(e.clientX-r.left-geo.m.l)/geo.pw;return Math.round(Math.max(0,Math.min(1,ratio))*(series.length-1))}
function switchPeriod(k){period=PERIODS.some(x=>x[0]===k)?k:'year';series=getSeries(period);selected=Math.max(0,series.length-1);renderPeriods();renderNotice();renderSummary();renderTable();select(selected);history.replaceState(null,'',`?id=${encodeURIComponent(id)}&period=${encodeURIComponent(period)}`)}
function csv(){if(!series.length)return;const dds=drawdowns(series),rows=[['time','granularity','roi_pct','pnl_usd','roi_change_pp','pnl_change_usd','drawdown_pct']];series.forEach((x,i)=>{const p=series[i-1];rows.push([x.timeText,x.granularity,x.roi,x.pnl??'',p?x.roi-p.roi:'',p&&x.pnl!=null&&p.pnl!=null?x.pnl-p.pnl:'',dds[i]])});const text='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${trader.name}-${period}-history.csv`;a.click();URL.revokeObjectURL(url)}
async function landscape(){try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape')}catch{$('#landscape').textContent='请手动横屏'}}
async function load(){try{if(!id)throw Error('缺少交易员代码');const r=await fetch(`./data/traders.json?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);payload=await r.json();trader=(payload.traders||[]).find(x=>String(x.id)===id||String(x.unique_code)===id);if(!trader)throw Error('当前榜单中没有找到该交易员');document.title=`${trader.name}｜周期曲线`;$('#name').textContent=trader.name;$('#sub').textContent=`OKX 年/月/周/日数据 · ${trader.unique_code}`;$('#okx').href=trader.profile_url||'#';renderCurrent();switchPeriod(period)}catch(e){$('#main').innerHTML=`<div class="empty"><b>曲线读取失败</b><span>${esc(e.message)}</span></div>`}}
$('#back').onclick=()=>history.length>1?history.back():location.assign('./');$('#landscape').onclick=landscape;$('#csv').onclick=csv;$('#periods').addEventListener('click',e=>{const b=e.target.closest('[data-period]');if(b)switchPeriod(b.dataset.period)});$('#tbody').addEventListener('click',e=>{const tr=e.target.closest('[data-i]');if(tr){select(+tr.dataset.i);canvas.scrollIntoView({behavior:'smooth',block:'center'})}});canvas.addEventListener('pointerdown',e=>{drag=true;canvas.setPointerCapture?.(e.pointerId);select(indexFromEvent(e))});canvas.addEventListener('pointermove',e=>{if(drag||e.pointerType==='mouse')select(indexFromEvent(e))});canvas.addEventListener('pointerup',e=>{drag=false;canvas.releasePointerCapture?.(e.pointerId)});canvas.addEventListener('pointercancel',()=>drag=false);canvas.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();select(selected-1)}if(e.key==='ArrowRight'){e.preventDefault();select(selected+1)}});addEventListener('resize',()=>requestAnimationFrame(drawChart));load();
</script>
</body>
</html>
